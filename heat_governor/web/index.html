<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- heat-governor mesh serve dashboard. Built from the locked design in docs/design/fleet-dashboard.html
     (Machines view, Polar night skin only). Live data from /api/fleet and /api/history on this origin;
     React 18.3.1, htm 3.1.1 and Lato are vendored under /vendor/ (see vendor/README.txt). -->
<title>Heat Governor</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family:"Lato"; font-style:normal; font-weight:300; font-display:swap; src:url(/vendor/lato-latin-300.woff2) format("woff2") }
@font-face { font-family:"Lato"; font-style:normal; font-weight:400; font-display:swap; src:url(/vendor/lato-latin-400.woff2) format("woff2") }
@font-face { font-family:"Lato"; font-style:normal; font-weight:700; font-display:swap; src:url(/vendor/lato-latin-700.woff2) format("woff2") }
@font-face { font-family:"Lato"; font-style:normal; font-weight:900; font-display:swap; src:url(/vendor/lato-latin-900.woff2) format("woff2") }
/* Polar night. Light (cream) is :root; dark (slate) is html[data-mode="dark"]. data-mode is resolved in
   script from the host's data-theme or prefers-color-scheme (Auto), or forced by the Light/Dark pills. */
:root { color-scheme: light;
  --s1:#e06a2a; --s2:#5a6bb5;
  --bg:#f5f0e6; --surface:#fbf8f1; --surface-2:#f7f2e9; --raise:#ece5d7;
  --ink:#38362f; --ink-soft:#6c675d; --ink-faint:#9f998c;
  --line:rgba(56,54,47,.08); --line-strong:rgba(56,54,47,.14);
  --cool:#3a8fb8; --warm:#c27a24; --hot:#d23f25; --accent:#e06a2a; --accent-tint:rgba(224,106,42,.08);
  --heat:linear-gradient(90deg,#a9d6ec,#5b8fb0 30%,#8b6f80 52%,#d8643f 72%,#e06a2a 86%,#f0a050);
  --dim:rgba(251,248,241,.86); --header:rgba(245,240,230,.86); --glow:none;
  --radius:16px; --ease:cubic-bezier(.22,1,.36,1);
  --font-body:"Lato",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace }
html[data-mode="dark"] { color-scheme:dark;
  --s1:#e06a2a; --s2:#7282e0;
  --bg:#0e1117; --surface:#151922; --surface-2:#1b202b; --raise:#252b39;
  --ink:#e9ebf0; --ink-soft:#9ba2b0; --ink-faint:#646b79;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --cool:#8ecbe8; --warm:#f2a65a; --hot:#ff5a3c; --accent:#ff8a3d; --accent-tint:rgba(255,138,61,.10);
  --heat:linear-gradient(90deg,#8ecbe8,#5b8fb0 30%,#7a5a6e 52%,#d8643f 72%,#ff8a3d 86%,#ffc27a);
  --dim:rgba(21,25,34,.86); --header:rgba(14,17,23,.82);
  --glow:radial-gradient(70% 100% at 50% 100%, rgba(255,138,61,.07), transparent 70%) }

* { box-sizing:border-box }
html { background:var(--bg); transition:background .4s var(--ease) }
body { margin:0; min-height:100%; color:var(--ink); background:var(--bg); font-family:var(--font-body); font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .4s var(--ease), color .4s var(--ease) }
body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; background:var(--glow) }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:6px }
code, .mono { font-family:var(--font-mono); font-size:.84em }
code { color:var(--ink-soft); overflow-wrap:anywhere }
.rune { font-family:"Segoe UI Historic","Noto Sans Runic","Junicode",serif; font-weight:400 }
button { font:inherit }

.app-header { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px 16px; flex-wrap:wrap;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--header); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line) }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg) }
@media (min-width:720px){ .app-header{ padding-left:max(40px,env(safe-area-inset-left,0px)); padding-right:max(40px,env(safe-area-inset-right,0px)) } }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; color:var(--ink-soft) }
.brand .mark { color:var(--accent); font-size:17px; width:18px; text-align:center }
.pills { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--surface); border:1px solid var(--line); overflow-x:auto; max-width:100% }
.pills button { appearance:none; border:0; background:transparent; color:var(--ink-soft); font-size:14px; padding:6px 15px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:color .25s var(--ease), background .25s var(--ease) }
.pills button:hover { color:var(--ink) }
.pills button[aria-pressed="true"], .pills button[aria-current="page"] { background:var(--raise); color:var(--ink); font-weight:700 }
.pills.sm button { font-size:13px; padding:5px 12px }
.pills .n { font-variant-numeric:tabular-nums; color:var(--ink-faint); margin-left:5px; font-weight:400 }

main { padding-block:32px 80px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); max-width:74rem; margin:0 auto }
@media (min-width:720px){ main{ padding-left:max(40px,env(safe-area-inset-left,0px)); padding-right:max(40px,env(safe-area-inset-right,0px)) } }
.titlebar { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px }
h1 { font-weight:900; font-size:clamp(2rem,4.6vw,2.8rem); line-height:1.05; letter-spacing:-.02em; margin:.25rem 0 0 }
h2 { font-weight:700; font-size:1.1rem; margin:2.6rem 0 1rem }
.lede { font-size:1.05rem; color:var(--ink-soft); max-width:44rem; margin:-.4rem 0 1.6rem; font-weight:300 }
.eyebrow { font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint) }


.card { min-width:0; padding:1.4rem 1.6rem; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); transition:background .4s var(--ease) }
.flow { overflow-x:auto }
.flow svg { display:block; min-width:640px; width:100% }

/* summary + filters */
.summary { display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 12px }
.chip { --m:var(--ink-faint); appearance:none; display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:12px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); font-size:.86rem; transition:border-color .2s, background .2s }
.chip b { font-size:1.15rem; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums }
.chip::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--m) }
.chip.cool { --m:var(--cool) } .chip.warm { --m:var(--warm) } .chip.hot { --m:var(--hot) } .chip.critical { --m:var(--hot) }
.chip.critical::before { box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 25%,transparent) }
.chip.unreachable::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.chip[aria-pressed="true"] { border-color:var(--m); background:color-mix(in srgb,var(--m) 9%,var(--surface)) }
.chip:disabled { opacity:.45; cursor:default }
.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px }
.search { flex:1 1 12rem; min-width:0; max-width:18rem; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px }
.search::placeholder { color:var(--ink-faint) }
.count { font-size:.82rem; color:var(--ink-faint); margin-left:auto }
.clear { appearance:none; border:0; background:none; color:var(--accent); cursor:pointer; font-size:.82rem; padding:4px 6px }

/* machine rows */
.lanes { display:grid; gap:10px }
.lane { --m:var(--ink-faint);
  display:grid; grid-template-columns:210px minmax(0,1fr) 230px; gap:26px; align-items:center;
  padding:18px 24px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line);
  transition:border-color .3s var(--ease), background .4s var(--ease) }
.lane:hover { border-color:var(--line-strong); background:var(--surface-2) }
.cool { --m:var(--cool) } .warm { --m:var(--warm) } .hot, .critical { --m:var(--hot) }
.lane.critical { border-color:color-mix(in srgb,var(--hot) 45%,transparent) }
.lane.unreachable { border-style:dashed; background:transparent }
.lane.unreachable .temp, .lane.unreachable .scale { opacity:.45 }
@media (max-width:900px){ .lane{ grid-template-columns:1fr; gap:14px; padding:18px } }
.who { display:grid; gap:1px; min-width:0 }
.who .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.who .mark { font-size:17px; color:var(--m); width:22px; text-align:center }
.who .name { font-weight:700; font-size:1.12rem }
.who .sub { font-size:.78rem; color:var(--ink-soft); padding-left:32px }
.who .sub.faint { color:var(--ink-faint) }
.tag { font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); border:1px solid var(--line-strong); border-radius:999px; padding:1px 7px }
.status { display:inline-flex; align-items:center; gap:7px; font-size:.8rem; color:var(--m); font-weight:700 }
.status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--m); box-shadow:0 0 0 4px color-mix(in srgb,var(--m) 16%,transparent) }
.unreachable .status::before { background:transparent; border:1.5px dashed var(--ink-faint); box-shadow:none }
.meter { min-width:0 }
.readout { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap }
.temp { font-variant-numeric:tabular-nums; font-weight:300; font-size:2.1rem; line-height:1; letter-spacing:-.02em }
.temp small { font-size:.85rem; color:var(--ink-faint); margin-left:3px }
.why { font-size:.8rem; color:var(--ink-faint) }
.scale { position:relative; height:6px; border-radius:999px; background:var(--heat); margin:13px 0 6px }
.scale .dim { position:absolute; top:0; bottom:0; right:0; background:var(--dim); border-radius:0 999px 999px 0 }
.scale .head { position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--surface); border:3px solid var(--m) }
.scale .band { position:absolute; top:-4px; bottom:-4px; border-inline:1px solid var(--ink-faint); background:color-mix(in srgb,var(--ink) 7%,transparent); border-radius:3px }
.scale.off { background:none; border:1px dashed var(--line-strong); height:6px }
.lane.unsupported, .tile.unsupported { border-style:dashed; background:transparent }
.unsupported .status::before { background:transparent; border:1.5px dashed var(--ink-faint); box-shadow:none }
.chip.unsupported::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.gpus { display:inline-flex; gap:3px; vertical-align:middle }
.gpus i { width:12px; height:12px; border-radius:3px }
.tile .gpus i { width:100%; height:8px } .tile .gpus { display:grid; grid-template-columns:repeat(8,1fr) }
.ticks { position:relative; height:16px; font-size:.68rem; color:var(--ink-faint); font-variant-numeric:tabular-nums }
.ticks span { position:absolute; white-space:nowrap }
.facts { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; min-width:0; font-size:.82rem }
.facts dt { color:var(--ink-faint) } .facts dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; color:var(--ink-soft) }

/* machine tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr)); gap:10px }
.tile { --m:var(--ink-faint); padding:16px 16px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); display:grid; gap:6px; min-width:0 }
.tile.critical { border-color:color-mix(in srgb,var(--hot) 45%,transparent) }
.tile.unreachable { border-style:dashed; background:transparent }
.tile .row { display:flex; justify-content:space-between; align-items:center; gap:8px }
.tile .nm { font-weight:700; display:flex; gap:8px; align-items:center; min-width:0 }
.tile .nm .mark { color:var(--m) }
.tile .temp { font-size:1.7rem }
.tile .scale { margin:6px 0 2px; height:4px }
.tile .scale .head { width:10px; height:10px; margin:-5px 0 0 -5px; border-width:2px }
.tile .meta { font-size:.72rem; color:var(--ink-faint); overflow-wrap:anywhere }
.empty { padding:40px; text-align:center; color:var(--ink-faint); border:1px dashed var(--line-strong); border-radius:var(--radius) }


/* info hints */
.info { position:relative; display:inline-flex; vertical-align:1px; margin-left:5px; cursor:help; border-radius:50% }
.info .i { display:inline-grid; place-items:center; width:14px; height:14px; border-radius:50%; border:1px solid var(--line-strong); color:var(--ink-faint); font-size:9px; font-weight:700; font-style:normal; line-height:1 }
.info:hover .i, .info:focus-visible .i { color:var(--ink); border-color:var(--ink-faint) }
.info .tipx { position:absolute; left:-6px; bottom:calc(100% + 8px); width:min(250px,70vw); padding:9px 11px; border-radius:10px; z-index:30;
  background:var(--surface-2); border:1px solid var(--line-strong); box-shadow:0 8px 24px rgba(0,0,0,.18); color:var(--ink-soft); font-size:.76rem; font-weight:400; line-height:1.45; text-transform:none; letter-spacing:0;
  opacity:0; visibility:hidden; transform:translateY(3px); transition:opacity .18s var(--ease), transform .18s var(--ease), visibility .18s }
.info:hover .tipx, .info:focus .tipx { opacity:1; visibility:visible; transform:none }

/* selectable machines */
.lane, .tile { cursor:pointer }
.lane:focus-visible, .tile:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
.lane[data-open="true"], .tile[data-open="true"] { border-color:var(--accent) }

/* detail drawer */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:20; animation:fade .25s var(--ease) }
.drawer { position:fixed; top:0; right:0; bottom:0; z-index:21; width:min(800px,100vw); background:var(--bg); border-left:1px solid var(--line);
  box-shadow:-20px 0 60px rgba(0,0,0,.25); overflow-y:auto; overscroll-behavior:contain; animation:slide .35s var(--ease);
  padding-top:max(20px,env(safe-area-inset-top,0px)); padding-bottom:max(32px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
@media (min-width:720px){ .drawer{ padding-left:28px; padding-right:max(28px,env(safe-area-inset-right,0px)) } }
@keyframes slide { from { transform:translateX(28px); opacity:0 } }
@keyframes fade { from { opacity:0 } }
.dh { display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
.dh h2 { margin:.2rem 0 0; font-size:1.7rem; font-weight:900; display:flex; gap:10px; align-items:center; flex-wrap:wrap }
.dh h2 .mark { color:var(--m); font-weight:400 }
.dh .sub { color:var(--ink-soft); font-size:.85rem }
.dnow { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin:12px 0 16px }
.xbtn { appearance:none; flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:20px; line-height:1 }
.xbtn:hover { border-color:var(--line-strong) }
.drow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin:0 0 12px }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:12px }
@media (max-width:600px){ .stats{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.stat { padding:12px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); min-width:0 }
.stat b { display:block; font-size:1.4rem; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-.01em; color:var(--ink) }
.stat span { font-size:.72rem; color:var(--ink-faint) }
.chartcard { position:relative; padding:14px 14px 10px; border-radius:14px; background:var(--surface); border:1px solid var(--line); margin-bottom:12px; min-width:0 }
.chartcard h3 { margin:0 0 8px; font-size:.86rem; font-weight:700 }
.chartcard svg.trend { display:block; width:100%; height:auto; touch-action:pan-y; outline:none }
.chartcard svg.trend:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:6px }
.chartcard svg text { font-family:var(--font-body); font-size:11px; fill:var(--ink-faint); font-variant-numeric:tabular-nums }
.chartcard svg text.end { font-size:11.5px; font-weight:700; fill:var(--ink-soft) }
.legend2 { display:flex; gap:16px; flex-wrap:wrap; font-size:.76rem; color:var(--ink-soft); margin:0 0 6px }
.legend2 i { display:inline-block; width:14px; height:2px; border-radius:2px; margin-right:6px; vertical-align:middle }
.legend2 i.sw { width:10px; height:10px; border-radius:3px; vertical-align:-1px }
.tip { position:absolute; top:44px; pointer-events:none; min-width:160px; padding:9px 11px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line-strong);
  box-shadow:0 8px 24px rgba(0,0,0,.18); font-size:.78rem; color:var(--ink-soft); z-index:2 }
.tip .tt { color:var(--ink-faint); margin-bottom:4px; font-size:.72rem }
.tip .r { display:flex; align-items:center; gap:12px; justify-content:space-between; white-space:nowrap }
.tip .r b { color:var(--ink); font-variant-numeric:tabular-nums }
.tip .r i { width:12px; height:2px; display:inline-block; margin-right:6px; vertical-align:middle; border-radius:2px }
.tip .r i.sw { width:8px; height:8px; border-radius:2px }
.seg2 { display:flex; height:20px; gap:2px }
.seg2 span { display:block; min-width:3px; border-radius:3px }
.sharelab { display:flex; gap:16px; flex-wrap:wrap; font-size:.76rem; color:var(--ink-soft); margin-top:8px }
.sharelab i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px }
.sharelab b { color:var(--ink); font-variant-numeric:tabular-nums; margin-right:3px }
.minis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 14px }
@media (max-width:600px){ .minis{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.mini { font-size:.72rem; color:var(--ink-faint); min-width:0 } .mini svg { display:block; width:100%; height:36px } .mini b { color:var(--ink) }
.tablewrap { overflow-x:auto }
table.dt { width:100%; border-collapse:collapse; font-size:.8rem; font-variant-numeric:tabular-nums }
.dt th, .dt td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap }
.dt th:first-child, .dt td:first-child { text-align:left }
.dt th { color:var(--ink-faint); font-weight:700 } .dt td { color:var(--ink-soft) }
.linkbtn { appearance:none; border:0; background:none; color:var(--accent); cursor:pointer; font-size:.82rem; padding:4px 2px }
.nodata { padding:44px 20px; text-align:center; color:var(--ink-faint); border:1px dashed var(--line-strong); border-radius:14px }
:root { --lv-cool:var(--cool); --lv-warm:var(--warm); --lv-hot:color-mix(in srgb,var(--hot) 55%,var(--warm)); --lv-critical:var(--hot) }

:root { --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6 }
html[data-mode="dark"] { --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9 }
.scrim { pointer-events:none; background:rgba(0,0,0,.12) }
@media (max-width:900px){ .scrim { pointer-events:auto; background:rgba(0,0,0,.3) } }
.drow-l { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.hint { font-size:.74rem; color:var(--ink-faint); margin:-4px 0 12px }
@media (max-width:900px){ .hint { display:none } }
.picker { position:relative }
.addbtn { appearance:none; border:1px dashed var(--line-strong); background:transparent; color:var(--ink-soft); border-radius:999px; padding:5px 13px; font-size:13px; cursor:pointer; transition:border-color .2s, color .2s }
.addbtn:hover:not(:disabled) { border-color:var(--accent); color:var(--ink) }
.addbtn:disabled { opacity:.55; cursor:default }
.pop { position:absolute; top:calc(100% + 6px); left:0; z-index:5; width:min(300px,80vw); padding:8px; border-radius:14px; background:var(--surface); border:1px solid var(--line-strong); box-shadow:0 14px 40px rgba(0,0,0,.2) }
.pop .search { max-width:none; width:100%; margin-bottom:6px }
.opts { max-height:280px; overflow-y:auto; display:grid; gap:2px }
.opt2 { --m:var(--ink-faint); appearance:none; display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:8px; align-items:center; width:100%; text-align:left; border:0; background:transparent; color:var(--ink); padding:7px 8px; border-radius:8px; cursor:pointer; font-size:.86rem }
.opt2:hover:not(:disabled) { background:var(--surface-2) }
.opt2:disabled { opacity:.45; cursor:default }
.opt2 .meta { font-size:.74rem; color:var(--ink-faint); white-space:nowrap }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px }
.mchip { display:inline-flex; align-items:center; gap:2px; padding:3px 4px 3px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:.84rem; font-weight:700 }
.mchip button, .rm { appearance:none; border:0; background:transparent; color:var(--ink-faint); width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:15px; line-height:1 }
.mchip button:hover, .rm:hover { background:var(--raise); color:var(--ink) }
i.key { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:7px; vertical-align:middle }
.dt.cmp td:first-child { font-weight:700; color:var(--ink) }
.dt.cmp .status { font-size:.74rem; margin-right:6px }
.lvrows { display:grid; gap:8px }
.lvrow { display:grid; grid-template-columns:120px minmax(0,1fr) 110px; gap:12px; align-items:center; font-size:.82rem }
.lvrow .nm { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.lvrow .pct { color:var(--ink-faint); font-size:.76rem; text-align:right; font-variant-numeric:tabular-nums }
@media (max-width:600px){ .lvrow { grid-template-columns:90px minmax(0,1fr) } .lvrow .pct { display:none } }

/* heat aura: grows with level; only critical moves */
.lane.warm, .tile.warm { box-shadow:0 0 26px -14px var(--warm) }
.lane.hot, .tile.hot { border-color:color-mix(in srgb,var(--hot) 30%,transparent); box-shadow:0 0 34px -12px var(--hot) }
.lane.critical, .tile.critical { box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 12%,transparent), 0 0 44px -10px var(--hot); animation:aura 2.4s ease-in-out infinite }
@keyframes aura {
  0%, 100% { box-shadow:0 0 0 0 color-mix(in srgb,var(--hot) 0%,transparent), 0 0 30px -12px var(--hot) }
  50% { box-shadow:0 0 0 4px color-mix(in srgb,var(--hot) 14%,transparent), 0 0 48px -8px var(--hot) } }
/* stale machines: last reading kept, drawn dashed like unreachable */
.lane.stale, .tile.stale { border-style:dashed; background:transparent }
.lane.stale .temp, .lane.stale .scale, .tile.stale .temp, .tile.stale .scale { opacity:.6 }
.tile.unreachable .temp, .tile.unreachable .scale { opacity:.45 }
.stale .status::before { background:transparent; border:1.5px dashed var(--m); box-shadow:none }
.chip.stale::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.stale { --m:var(--ink-soft) }
.livebar { display:inline-flex; align-items:center; gap:8px }
.livebar.down { color:var(--hot) }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important }
  .lane.critical, .tile.critical { box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 12%,transparent), 0 0 44px -10px var(--hot) } }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.js"></script>
<script>
"use strict";
const html = htm.bind(React.createElement);
const { useState, useEffect, useMemo, useRef } = React;
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const PLATFORM_LABEL = { ventunoq:"VENTUNO Q", spark:"Spark", thor:"Thor", orin:"Orin", nano:"Orin Nano", generic:"Generic", windows:"Windows" };
const titleCase = s => String(s || "unknown").replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const platLabel = p => PLATFORM_LABEL[p] || titleCase(p);
// Elder Futhark initial of the machine's name: c→ᚲ, s→ᛋ, th→ᚦ, o→ᛟ, n→ᚾ, m→ᛗ, h→ᚺ, g→ᚷ
const rune = n => n.startsWith("th") ? "ᚦ" : ({ c:"ᚲ", s:"ᛋ", o:"ᛟ", n:"ᚾ", m:"ᛗ", h:"ᚺ", g:"ᚷ" })[n[0]] || "ᚠ";
const fmt = (n, d=1) => n == null ? "—" : Number(n).toFixed(d);
const fin = v => typeof v === "number" && isFinite(v);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SEVERITY = { critical:6, hot:5, warm:4, unreachable:3, stale:2.5, unsupported:2, cool:0 };
const STATES = ["critical", "hot", "warm", "cool", "stale", "unreachable", "unsupported"];
const LEVELS = ["cool", "warm", "hot", "critical"];

// ---- /api/fleet machine -> one row of the UI ----
function toBox(m) {
  const t = m.thermal || null;
  const unsupported = m.state === "unsupported";
  const lim = t && t.limits && fin(t.limits.warm_c) && fin(t.limits.crit_c) ? t.limits : null;
  const state = unsupported ? "unsupported" : m.state === "ok" ? (LEVELS.includes(t && t.level) ? t.level : "stale") : (m.state === "stale" ? "stale" : "unreachable");
  const pair = t && t.pair && typeof t.pair === "object" ? t.pair : null;
  return {
    name: m.name, transport: m.transport, host: m.host, hub: m.transport === "local",
    pkey: (t && t.platform) || (unsupported ? "unsupported" : "unknown"),
    state, age: m.age_s, health: m.health || {},
    // no made-up reading: unsupported machines show none, unreachable ones their last
    temp: unsupported || !t ? null : (fin(t.temp_c) ? t.temp_c : null),
    gpu_temp: unsupported || !t ? null : (fin(t.gpu_temp_c) ? t.gpu_temp_c : null),
    gpus: t && Array.isArray(t.gpus_c) && t.gpus_c.length ? t.gpus_c : null,
    limits: unsupported ? null : lim,
    level: t ? t.level : null, admit: t ? t.admit : null, cf: t ? t.concurrency_factor : null,
    reason: t ? t.reason : null, rate: t && fin(t.rate_c_s) ? t.rate_c_s : null,
    containers: t && Array.isArray(t.containers) ? t.containers : [], applying: t ? !!t.applying : false,
    version: t ? t.version : null, zone: t ? t.hottest_zone : null, gpu_clock: t ? t.gpu_clock : null,
    fan_rpm: t && fin(t.fan_rpm) ? t.fan_rpm : null, power_w: t && fin(t.power_w) ? t.power_w : null,
    zones: t && fin(t.zones) ? t.zones : null,
    pair: pair ? (pair.peer_host || pair.peer || "peer") : null, pair_status: pair ? pair.peer_status : null,
    hasReading: !!t,
  };
}

// ---- live data ----
function useFleet() {
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    let alive = true, timer = null;
    const tick = async () => {
      let wait = 5;
      try {
        const r = await fetch("/api/fleet", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        if (!alive) return;
        setDoc(d); setErr(null);
        wait = clamp(Number(d.reader && d.reader.poll_s) || 5, 2, 10);
      } catch (e) { if (alive) setErr(String((e && e.message) || e)); }
      if (alive) timer = setTimeout(tick, wait * 1000);
    };
    tick();
    return () => { alive = false; clearTimeout(timer); };
  }, []);
  return { doc, err };
}

const HISTORY_REFRESH_MS = 15000;
function useHistory(names, rk) {
  const [data, setData] = useState({});
  const key = names.join("\n") + "|" + rk;
  useEffect(() => {
    let alive = true, timer = null;
    const load = async () => {
      await Promise.all(names.map(async n => {
        try {
          const r = await fetch("/api/history?machine=" + encodeURIComponent(n) + "&range=" + rk, { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          if (alive) setData(o => ({ ...o, [n + "|" + rk]: Array.isArray(d.samples) ? d.samples : [] }));
        } catch (e) { /* keep what is shown; the next refresh retries */ }
      }));
      if (alive) timer = setTimeout(load, HISTORY_REFRESH_MS);
    };
    load();
    return () => { alive = false; clearTimeout(timer); };
  }, [key]);
  return n => data[n + "|" + rk];
}

// ---- theme mode: Auto follows the host theme, Light/Dark override ----
function useMode(pref) {
  const sys = () => { const t = document.documentElement.getAttribute("data-theme"); if (t === "dark" || t === "light") return t;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; };
  const [sysMode, setSys] = useState(sys);
  useEffect(() => {
    const mq = matchMedia("(prefers-color-scheme: dark)"); const on = () => setSys(sys());
    mq.addEventListener("change", on);
    const mo = new MutationObserver(on); mo.observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
    return () => { mq.removeEventListener("change", on); mo.disconnect(); };
  }, []);
  return pref === "system" ? sysMode : pref;
}

function Scale({ temp, limits, lo = 30, hi, small }) {
  hi = hi || Math.max(110, (limits && limits.crit_c + 6) || 110);
  const pct = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  // one band from warm to crit with a single label, so close limits never collide
  const a = limits ? pct(limits.warm_c) : null, z = limits ? pct(limits.crit_c) : null;
  const mid = limits ? (a + z) / 2 : 0;
  const anchor = mid > 85 ? { right: (100 - z) + "%" } : mid < 15 ? { left: a + "%" } : { left: mid + "%", transform: "translateX(-50%)" };
  if (temp == null) return html`<div><div class="scale off" role="img" aria-label="no reading"></div>${!small && html`<div class="ticks"><span style=${{ left: 0 }}>no reading</span></div>`}</div>`;
  return html`<div>
    <div class="scale" role="img" aria-label=${`${fmt(temp)} °C${limits ? `, warm to critical band ${limits.warm_c} to ${limits.crit_c} °C` : ""}`}>
      <div class="dim" style=${{ left: pct(temp) + "%" }}></div>
      ${limits && html`<div class="band" style=${{ left: a + "%", width: (z - a) + "%" }}></div>`}
      <div class="head" style=${{ left: pct(temp) + "%" }}></div>
    </div>
    ${!small && limits && html`<div class="ticks"><span style=${anchor}>${limits.warm_c}–${limits.crit_c}°</span></div>`}
  </div>`;
}

const Mark = ({ b }) => html`<span class="mark rune" aria-hidden="true">${rune(b.name)}</span>`;
const ageText = s => s == null ? "" : s < 90 ? Math.round(s) + "s" : s < 5400 ? Math.round(s / 60) + "m" : Math.round(s / 3600) + "h";
const statusText = b => b.state === "unreachable" ? (b.hasReading ? `unreachable · ${ageText(b.age)}` : "unreachable") :
  b.state === "stale" ? `stale · ${ageText(b.age)}` : b.state === "unsupported" ? "not supported" : b.state;
const whyText = b => b.state === "unsupported" ? "heat-governor can't read this machine" :
  (b.state === "unreachable" || b.state === "stale") ? (b.hasReading ? "last reading shown" : "no readings") :
  `${b.reason || "steady"}${b.rate != null ? " · " + (b.rate > 0 ? "+" : "") + fmt(b.rate, 2) + " °C/s" : ""}`;
const subLine = b => b.state === "unsupported" ? "not supported" : [platLabel(b.pkey), b.version ? "v" + b.version : ""].filter(Boolean).join(" · ");
const viaLine = b => b.hub ? "this machine · local" : `${b.host || b.name} · ${b.transport || "ssh"}`;
// per-GPU strip for multi-GPU boxes: one cell per GPU, coloured against the box's limits
function Gpus({ b }) {
  if (!b.gpus || !b.limits) return null;
  const c = t => t >= b.limits.crit_c ? "var(--hot)" : t >= b.limits.warm_c ? "var(--warm)" : "var(--cool)";
  return html`<span class="gpus" role="img" aria-label=${"GPU temperatures: " + b.gpus.map(t => fmt(t, 0)).join(", ") + " °C"}>
    ${b.gpus.map((t, i) => html`<i key=${i} title=${`GPU ${i}: ${fmt(t, 0)} °C`} style=${{ background: c(t), opacity: .35 + .65 * Math.min(1, Math.max(0, (t - 55) / 35)) }}></i>`)}</span>`;
}

// small (i) hint: hover or focus shows a plain-language explanation; never opens the machine
const HINT = {
  admit: "Whether clients may start new work here. ×1.00 is full speed, ×0.50 means run half as many jobs, holding means start nothing new until it cools.",
  containers: "Docker containers this governor watches. Applying means it really pauses or CPU-caps them when hot; dry-run means it only logs what it would do.",
  gpu: "GPU temperature, then the GPU clock ceiling when the daemon reports one.",
  pair: "The other half of a tensor-parallel pair. Both boxes cap the pair's containers by whichever box is hotter. ok means the partner's state is fresh.",
  gpus: "One cell per GPU, coloured against this machine's limits. The hottest GPU drives the machine's level.",
  fan: "Fan speed read from the board's fan controller. The kernel drives it, not the governor.",
  power: "Board power from the board's power monitor.",
  zones: "Thermal zones being watched. The hottest one drives the machine's level.",
  sensors: "heat-governor reads Linux /sys thermal zones, so it can't see this machine's sensors.",
  band: "The shaded range runs from warm, where the governor starts slowing new work, to critical, where it stops admitting work and pauses batch jobs.",
};
function Info({ k }) {
  return html`<span class="info" tabIndex="0" aria-label=${HINT[k]} onClick=${e => e.stopPropagation()} onKeyDown=${e => e.stopPropagation()}>
    <i class="i" aria-hidden="true">i</i><span class="tipx" role="tooltip">${HINT[k]}</span></span>`;
}

function Facts({ b }) {
  if (b.state === "unsupported") return html`<dl class="facts">
    <dt>Sensors<${Info} k="sensors" /></dt><dd>none readable</dd>
    <dt>Containers</dt><dd>not governed</dd></dl>`;
  const live = b.state !== "unreachable" && b.state !== "stale";
  const gpu = [b.gpu_temp != null ? fmt(b.gpu_temp, 0) + " °C" : "", b.gpu_clock ? String(b.gpu_clock) : ""].filter(Boolean).join(" · ") || "—";
  return html`<dl class="facts">
    <dt>Admitting<${Info} k="admit" /></dt><dd>${live && b.admit != null ? (b.admit ? "yes" : "holding") + " · ×" + fmt(b.cf, 2) : "unknown"}</dd>
    <dt>Containers<${Info} k="containers" /></dt><dd>${b.hasReading ? `${b.containers.length}${b.applying ? ", applying" : ", dry-run"}` : "—"}</dd>
    <dt>GPU<${Info} k="gpu" /></dt><dd>${gpu}</dd>
    ${b.gpus ? html`<dt>GPUs<${Info} k="gpus" /></dt><dd><${Gpus} b=${b} /></dd>` : html`<dt>Pair<${Info} k="pair" /></dt><dd>${b.pair ? `${b.pair}, ${b.pair_status || "?"}` : "—"}</dd>`}
    ${b.fan_rpm != null && html`<dt>Fan<${Info} k="fan" /></dt><dd>${fmt(b.fan_rpm, 0)} rpm</dd>`}
    ${b.power_w != null && html`<dt>Power<${Info} k="power" /></dt><dd>${fmt(b.power_w, 2)} W</dd>`}
    ${b.zones != null && html`<dt>Zones<${Info} k="zones" /></dt><dd>${b.zones}${b.zone ? " · " + b.zone : ""}</dd>`}
  </dl>`;
}

function Lane({ b, open, onOpen }) {
  return html`<article class=${"lane " + b.state} role="button" tabIndex="0" aria-haspopup="dialog" aria-label=${(open ? "Remove " : "Show trends for ") + b.name} aria-pressed=${open} data-open=${open}
    title=${b.health.failing || b.state !== 'ok' ? b.health.last_error || undefined : undefined}
    onClick=${() => onOpen(b.name)} onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(b.name); } }}>
    <div class="who">
      <div class="top"><${Mark} b=${b} /><span class="name">${b.name}</span>${b.hub && html`<span class="tag">reader</span>`}</div>
      <span class="sub">${subLine(b)}</span>
      <span class="sub faint">${viaLine(b)}</span>
    </div>
    <div class="meter">
      <div class="readout">
        <span class="temp">${fmt(b.temp)}<small>°C</small></span>
        <span class="status">${statusText(b)}</span>
        <span class="why">${whyText(b)}</span>
      </div>
      <${Scale} temp=${b.temp} limits=${b.limits} />
    </div>
    <${Facts} b=${b} />
  </article>`;
}

function Tile({ b, open, onOpen }) {
  return html`<article class=${"tile " + b.state} role="button" tabIndex="0" aria-haspopup="dialog" aria-label=${(open ? "Remove " : "Show trends for ") + b.name} aria-pressed=${open} data-open=${open}
    title=${b.health.failing || b.state !== 'ok' ? b.health.last_error || undefined : undefined}
    onClick=${() => onOpen(b.name)} onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(b.name); } }}>
    <div class="row"><span class="nm"><${Mark} b=${b} />${b.name}</span>${b.hub && html`<span class="tag">reader</span>`}</div>
    <div class="row"><span class="temp">${fmt(b.temp)}<small>°C</small></span><span class="status">${statusText(b)}</span></div>
    <${Scale} temp=${b.temp} limits=${b.limits} small=${true} />
    ${b.gpus && html`<${Gpus} b=${b} />`}
    <span class="meta">${platLabel(b.pkey)}${b.pair ? " · pair " + b.pair : ""} · ${whyText(b)}</span>
  </article>`;
}

// Fleet map: one node per platform group around the hub (the machine the reader runs on); each node
// is coloured by its worst member and names the states that need attention.
function Flow({ fleet }) {
  const colour = s => ({ cool:"var(--cool)", warm:"var(--warm)", hot:"var(--hot)", critical:"var(--hot)" })[s] || "var(--ink-faint)";
  const hub = fleet.find(b => b.hub);
  const others = fleet.filter(b => b !== hub);
  const keys = [...new Set(others.map(b => b.pkey))];
  const groups = keys.map(p => {
    const ms = others.filter(b => b.pkey === p);
    const worst = ms.reduce((w, b) => SEVERITY[b.state] > SEVERITY[w] ? b.state : w, "cool");
    const c = ms.reduce((o, b) => (o[b.state] = (o[b.state] || 0) + 1, o), {});
    const issues = ["critical", "hot", "warm", "stale", "unreachable", "unsupported"].filter(s => c[s]).map(s => ms.length === 1 ? (s === "unsupported" ? "not supported" : s) : `${c[s]} ${s === "unsupported" ? "not supported" : s}`);
    const pairs = Math.floor(ms.filter(b => b.pair).length / 2);
    const gpus = ms.reduce((n, b) => n + (b.gpus ? b.gpus.length : 0), 0);
    // at most two items per line, so the summary always fits inside its box
    const sub = issues.length ? Array.from({ length: Math.ceil(issues.length / 2) }, (_, k) => issues.slice(k * 2, k * 2 + 2).join(" · "))
      : [[pairs ? `${pairs} pair${pairs > 1 ? "s" : ""}` : "", gpus ? `${gpus} GPUs` : "", "all cool"].filter(Boolean).join(" · ")];
    return { p, n: ms.length, worst, sub };
  });
  // groups alternate left and right of the hub; the map grows taller as groups are added
  const lines = Math.max(1, ...groups.map(g => g.sub.length));
  const rows = Math.max(2, Math.ceil(groups.length / 2)), gw = 220, gh = 48 + lines * 16, rowGap = 22;
  const W = 900, H = rows * gh + (rows - 1) * rowGap + 40, hx = W / 2, hy = H / 2;
  const spots = groups.map((g, i) => [i % 2 ? W - 30 - gw : 30, 20 + Math.floor(i / 2) * (gh + rowGap)]);
  const label = g => g.n > 1 ? `${platLabel(g.p)} × ${g.n}` : platLabel(g.p);
  const colourOf = s => s === "unsupported" ? "transparent" : colour(s);
  const dashed = s => s === "unsupported" || s === "unreachable" || s === "stale";
  const hubName = hub ? hub.name : "reader";
  return html`<div class="flow"><svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${"Fleet: " + (groups.map(g => `${g.n} ${platLabel(g.p)}`).join(", ") || "no other machines") + ", read by " + hubName}>
    ${groups.map((g, i) => { const [x, y] = spots[i]; const cx = x < hx ? x + gw : x, cy = y + gh / 2; return html`<g key=${g.p} opacity=${g.worst === "unsupported" ? .6 : 1}>
      <path d=${`M${cx} ${cy} C ${(cx + hx) / 2} ${cy}, ${(cx + hx) / 2} ${hy}, ${x < hx ? hx - 110 : hx + 110} ${hy}`} fill="none" stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray=${dashed(g.worst) ? "4 5" : "none"}/>
      <rect x=${x} y=${y} width=${gw} height=${gh} rx="14" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2" stroke-dasharray=${g.worst === "unsupported" ? "4 4" : "none"}/>
      <circle cx=${x + 22} cy=${y + 24} r="5" fill=${colourOf(g.worst)} stroke=${g.worst === "unsupported" ? "var(--ink-faint)" : "none"} stroke-dasharray="2 2"/>
      <text x=${x + 36} y=${y + 29} font-weight="700" font-size="15" fill="var(--ink)">${label(g)}</text>
      ${g.sub.map((ln, k) => html`<text key=${k} x=${x + 36} y=${y + 49 + k * 16} font-size="12" fill="var(--ink-soft)">${ln}</text>`)}</g>`; })}
    <rect x=${hx - 110} y=${hy - 34} width="220" height="68" rx="16" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x=${hx} y=${hy - 4} text-anchor="middle" font-weight="900" font-size="16" fill="var(--ink)">${hubName}</text>
    <text x=${hx} y=${hy + 16} text-anchor="middle" font-size="12" fill="var(--ink-soft)">${hub ? `${platLabel(hub.pkey)} · ${statusText(hub)}` : "fleet reader"}</text>
  </svg></div>`;
}

// ---- machine trends: real samples from the reader's buffer (/api/history) ----
const RANGES = { "15m": { s: 900, label: "15 min" }, "1h": { s: 3600, label: "1 hour" }, "6h": { s: 21600, label: "6 hours" }, "24h": { s: 86400, label: "24 hours" } };
const CF = [1, .5, .25, 0];
// samples -> chart series on a wall-clock window ending now. A null entry is inserted wherever
// consecutive samples are further apart than 3x their usual spacing, so missing periods draw as gaps.
function toHist(samples, rk, nowS) {
  if (!samples || !samples.length) return null;
  const t1 = nowS * 1000, t0 = t1 - RANGES[rk].s * 1000;
  const rows = samples.filter(s => fin(s.t)).map(s => ({ ...s, ms: s.t * 1000 })).filter(s => s.ms >= t0 - 1000);
  if (!rows.length) return null;
  const dts = []; for (let i = 1; i < rows.length; i++) dts.push(rows[i].ms - rows[i - 1].ms);
  dts.sort((a, b) => a - b);
  const med = dts.length ? dts[Math.floor(dts.length / 2)] : RANGES[rk].s * 1000 / 300;
  const gap = Math.max(med * 3, 1000);
  // per-GPU series: only when the samples carry them (the reader does not record them today)
  const ng = rows.reduce((n, s) => Math.max(n, Array.isArray(s.gpus_c) ? s.gpus_c.length : 0), 0);

        <path d=${`M${x(e.h.t[e.li]) + 6},${e.vy} L${R + 8},${e.vy} L${R + 14},${e.ly}`} fill="none" stroke="var(--line-strong)" stroke-width="1"/>
        <text class="end" x=${R + 18} y=${e.ly + 4}>${e.b.name} ${fmt(e.h.temp[e.li])}°</text></g>`)}
      ${timeTicks(t0, t1).map((ms, k) => html`<text key=${"x" + k} x=${x(ms)} y=${B + 18} text-anchor=${k === 0 ? "start" : k === 4 ? "end" : "middle"}>${hhmm(ms)}</text>`)}
      ${list.map((o, r) => { const yy = stripTop + r * rowH;
        return html`<g key=${"s" + o.b.name}>
          <line x1=${R + 8} x2=${R + 14} y1=${yy + 5} y2=${yy + 5} stroke=${o.c} stroke-width="2"/>
          <text x=${R + 18} y=${yy + 9}>${o.b.name}</text>
          ${o.b.limits ? levelRuns(o.h).map((rn, k) => html`<rect key=${k} x=${x(rn.a)} y=${yy} width=${Math.max(1, x(rn.z) - x(rn.a))} height="10" rx="2" fill=${lvColor(rn.l)}/>`)
            : html`<rect x=${L} y=${yy} width=${R - L} height="10" rx="2" fill="none" stroke="var(--line-strong)" stroke-dasharray="3 3"/>`}
        </g>`; })}
      <text x=${L - 8} y=${stripTop + 9} text-anchor="end">level</text>
      ${ct != null && html`<g pointer-events="none">
        <line x1=${x(ct)} x2=${x(ct)} y1=${T} y2=${stripTop + list.length * rowH} stroke="var(--ink-faint)" stroke-width="1"/>
        ${list.map(o => { const i = at(o); return i >= 0 && o.h.temp[i] != null && html`<circle key=${"h" + o.b.name} cx=${x(o.h.t[i])} cy=${y(o.h.temp[i])} r="4.5" fill=${o.c} stroke="var(--surface)" stroke-width="2"/>`; })}
      </g>`}
    </svg>
    ${ct != null && html`<div class="tip" style=${tipLeft > 55 ? { right: (100 - tipLeft + 2) + "%" } : { left: (tipLeft + 2) + "%" }}>
      <div class="tt">${rk === "15m" ? hhmmss(ct) : hhmm(ct)} UTC</div>
      ${[...list].sort((a, b) => (val(b, "temp") ?? -1) - (val(a, "temp") ?? -1)).map(o => { const v = val(o, "temp"), l = val(o, "level"); return html`<div class="r" key=${o.b.name}>
        <span><i style=${{ background: o.c }}></i>${o.b.name}</span>
        <b>${v == null ? "—" : fmt(v) + " °C"}${l != null ? " · " + LEVELS[l] : ""}</b></div>`; })}
    </div>`}
  </div>`;
}

function Compare({ items, slots, rk, table, onRemove, histOf, nowS }) {
  const list = items.map(b => ({ b, h: toHist(histOf(b.name), rk, nowS), c: slotColor(slots[b.name] ?? 0) })).filter(o => o.h);
  if (!list.length) return html`<div class="nodata">${items.some(b => histOf(b.name) === undefined) ? "Loading history…" : `None of these machines has readings in the last ${RANGES[rk].label}.`}</div>`;
  const missing = items.filter(b => !list.some(o => o.b === b));
  const times = tableTimes(list[0].h);
  return html`<${React.Fragment}>
    <div class="chartcard tablewrap"><table class="dt cmp">
      <thead><tr><th>Machine</th><th>Now</th><th>Peak</th><th>Average</th><th>Above warm</th><th></th></tr></thead>
      <tbody>${list.map(o => { const s = summarize(o.b, o.h); return html`<tr key=${o.b.name}>
        <td><i class="key" style=${{ background: o.c }}></i>${o.b.name}</td>
        <td><span class=${"status " + o.b.state}>${statusText(o.b)}</span> ${fmt(o.b.temp)}°</td>
        <td>${fmt(s.peak)}°</td><td>${fmt(s.mean)}°</td>
        <td>${s.share ? Math.round((1 - s.share[0]) * 100) + "%" : "—"}</td>
        <td><button class="rm" onClick=${() => onRemove(o.b.name)} aria-label=${"Remove " + o.b.name}>×</button></td></tr>`; })}
      ${missing.map(b => html`<tr key=${b.name}><td><i class="key" style=${{ background: slotColor(slots[b.name] ?? 0) }}></i>${b.name}</td>
        <td colspan="4">no readings in the last ${RANGES[rk].label}</td>
        <td><button class="rm" onClick=${() => onRemove(b.name)} aria-label=${"Remove " + b.name}>×</button></td></tr>`)}</tbody>
    </table></div>
    ${table ? html`<div class="chartcard tablewrap"><table class="dt">
        <thead><tr><th>Time (UTC)</th>${list.map(o => html`<th key=${o.b.name}>${o.b.name}</th>`)}</tr></thead>
        <tbody>${times.map(ms => html`<tr key=${ms}><td>${rk === "15m" ? hhmmss(ms) : hhmm(ms)}</td>
          ${list.map(o => { const i = nearest(o.h, ms); return html`<td key=${o.b.name}>${i < 0 || o.h.temp[i] == null ? "—" : fmt(o.h.temp[i]) + " °C"}</td>`; })}</tr>`)}</tbody>
      </table></div>` : html`<${CompareChart} list=${list} rk=${rk} key=${rk + list.map(o => o.b.name).join()} />`}
    ${list.some(o => o.b.limits && summarize(o.b, o.h).share) && html`<div class="chartcard"><h3>Time by level · last ${RANGES[rk].label}</h3>
      <div class="lvrows">${list.map(o => ({ o, s: summarize(o.b, o.h) })).filter(({ o, s }) => o.b.limits && s.share).map(({ o, s }) => html`<div class="lvrow" key=${o.b.name}>
        <span class="nm"><i class="key" style=${{ background: o.c }}></i>${o.b.name}</span>
        <div class="seg2" role="img" aria-label=${o.b.name + ": " + LEVELS.map((l, i) => `${l} ${Math.round(s.share[i] * 100)}%`).join(", ")}>
          ${s.share.map((x, i) => x > 0 && html`<span key=${i} style=${{ flex: x, background: lvColor(i) }} title=${`${LEVELS[i]} ${Math.round(x * 100)}%`}></span>`)}</div>
        <span class="pct">${Math.round((1 - s.share[0]) * 100)}% above warm</span></div>`)}</div>
      <div class="sharelab">${LEVELS.map((l, i) => html`<span key=${l}><i style=${{ background: lvColor(i) }}></i>${l}</span>`)}</div>
    </div>`}
  </${React.Fragment}>`;
}

function AddPicker({ fleet, items, onAdd }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const wrap = useRef(null);
  useEffect(() => {
    if (!open) return;
    const off = e => { if (wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    addEventListener("pointerdown", off); return () => removeEventListener("pointerdown", off);
  }, [open]);
  const full = items.length >= MAXC, names = new Set(items.map(b => b.name));
  const opts = fleet.filter(b => !q || b.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => (SEVERITY[b.state] - SEVERITY[a.state]) || ((b.temp ?? -1) - (a.temp ?? -1)));
  return html`<div class="picker" ref=${wrap}>
    <button class="addbtn" aria-expanded=${open} aria-haspopup="listbox" disabled=${full} onClick=${() => setOpen(o => !o)}>
      ${full ? `${MAXC} machines max` : "+ Add machine"}</button>
    ${open && html`<div class="pop" onKeyDown=${e => { if (e.key === "Escape") { e.stopPropagation(); setOpen(false); } }}>
      <input id="add-machine-search" class="search" type="search" placeholder="Find a machine" value=${q} onInput=${e => setQ(e.target.value)} autoFocus aria-label="Find a machine to add" />
      <div class="opts" role="listbox" aria-label="Machines">
        ${opts.map(b => { const off = names.has(b.name) || b.temp == null;
          return html`<button key=${b.name} role="option" aria-selected=${names.has(b.name)} class=${"opt2 " + b.state} disabled=${off}
            onClick=${() => { onAdd(b.name); setQ(""); if (items.length + 1 >= MAXC) setOpen(false); }}>
            <span class="status"></span><span class="nm">${b.name}</span>
            <span class="meta">${b.temp == null ? "no readings" : names.has(b.name) ? "added" : fmt(b.temp) + "° · " + platLabel(b.pkey)}</span></button>`; })}
      </div></div>`}
  </div>`;
}

function Detail({ items, slots, fleet, nowS, keptS, onClose, onAdd, onRemove }) {
  const [rk, setRk] = useState("1h");
  const [table, setTable] = useState(false);
  const closeRef = useRef(null);
  useEffect(() => {
    const prev = document.activeElement; closeRef.current && closeRef.current.focus();
    const on = e => { if (e.key === "Escape") onClose(); };
    addEventListener("keydown", on);
    return () => { removeEventListener("keydown", on); prev && prev.focus && prev.focus(); };
  }, []);
  const histOf = useHistory(items.filter(b => b.state !== "unsupported").map(b => b.name), rk);
  const one = items.length === 1, b = items[0];
  const raw = one ? histOf(b.name) : null;
  const h = one ? toHist(raw, rk, nowS) : null;
  const kept = keptS ? (keptS >= 3600 ? Math.round(keptS / 3600) + " h" : Math.round(keptS / 60) + " min") : "";
  return html`<${React.Fragment}>
    <div class="scrim"></div>
    <aside class=${"drawer " + (one ? b.state : "")} role="dialog" aria-label=${one ? b.name + " trends" : "Comparing " + items.length + " machines"}>
      <div class="dh">
        <div style=${{ minWidth: 0 }}>
          <span class="eyebrow">Trends · read by the fleet reader${kept ? " · last " + kept + " kept" : ""}</span>
          ${one ? html`<h2><${Mark} b=${b} />${b.name}${b.hub && html`<span class="tag">reader</span>`}</h2>
            <div class="sub">${subLine(b)} · ${viaLine(b)}</div>`
          : html`<h2>Comparing ${items.length} machines</h2>
            <div class="chips">${items.map(m => html`<span class="mchip" key=${m.name}><i class="key" style=${{ background: slotColor(slots[m.name] ?? 0) }}></i>${m.name}
              <button onClick=${() => onRemove(m.name)} aria-label=${"Remove " + m.name}>×</button></span>`)}</div>`}
        </div>
        <button class="xbtn" ref=${closeRef} onClick=${onClose} aria-label="Close">×</button>
      </div>
      ${one && html`<div class="dnow">
        <span class="temp">${fmt(b.temp)}<small>°C</small></span>
        <span class="status">${statusText(b)}</span>
        <span class="why">${whyText(b)}</span>
      </div>`}
      <div class="drow">
        <div class="drow-l">
          ${!(one && b.state === "unsupported") && html`<div class="pills sm" role="group" aria-label="Time range">
            ${Object.keys(RANGES).map(k => html`<button key=${k} aria-pressed=${rk === k} onClick=${() => setRk(k)}>${k}</button>`)}
          </div>`}
          <${AddPicker} fleet=${fleet} items=${items} onAdd=${onAdd} />
        </div>
        ${(!one || h) && html`<button class="linkbtn" onClick=${() => setTable(t => !t)} aria-pressed=${table}>${table ? "Show chart" : "Show table"}</button>`}
      </div>
      <p class="hint">You can also click machines in the list to add or remove them.</p>
      ${one ? (b.state === "unsupported" ? html`<div class="nodata">No readings. ${HINT.sensors}</div>`
              : h ? html`<${Single} b=${b} h=${h} rk=${rk} table=${table} />`
              : html`<div class="nodata">${raw === undefined ? "Loading history…" : `No readings in the last ${RANGES[rk].label}.`}</div>`)
            : html`<${Compare} items=${items} slots=${slots} rk=${rk} table=${table} onRemove=${onRemove} histOf=${histOf} nowS=${nowS} />`}
    </aside>
  </${React.Fragment}>`;
}

function Machines({ doc, err }) {
  const fleet = useMemo(() => ((doc && doc.machines) || []).map(toBox), [doc]);
  const reader = (doc && doc.reader) || {};
  const nowS = fin(reader.now) ? reader.now : Date.now() / 1000;
  const [plat, setPlat] = useState("all");
  const [states, setStates] = useState([]);
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("hot");
  const [view, setView] = useState(() => store.get("hg-view", "rows"));
  // picks and their colour slots change together, so rapid clicks never share a colour
  const [sel, setSel] = useState({ picked: [], slots: {} });
  const { picked, slots } = sel;
  // colour follows the machine: each gets the lowest free slot when added and keeps it
  const add = name => setSel(({ picked: p, slots: s }) => {
    if (p.includes(name) || p.length >= MAXC) return { picked: p, slots: s };
    const used = new Set(p.map(n => s[n])); let k = 0; while (used.has(k)) k++;
    return { picked: [...p, name], slots: { ...s, [name]: k } }; });
  const remove = name => setSel(({ picked: p, slots: s }) => ({ picked: p.filter(n => n !== name), slots: s }));
  const onOpen = name => setSel(({ picked: p, slots: s }) => {
    if (!p.length) return { picked: [name], slots: { [name]: 0 } };
    if (p.includes(name)) return { picked: p.filter(n => n !== name), slots: s };
    if (p.length >= MAXC) return { picked: p, slots: s };
    const used = new Set(p.map(n => s[n])); let k = 0; while (used.has(k)) k++;
    return { picked: [...p, name], slots: { ...s, [name]: k } }; });
  const items = picked.map(n => fleet.find(b => b.name === n)).filter(Boolean);
  const counts = useMemo(() => fleet.reduce((c, b) => (c[b.state] = (c[b.state] || 0) + 1, c), {}), [fleet]);
  const platCounts = useMemo(() => fleet.reduce((c, b) => (c[b.pkey] = (c[b.pkey] || 0) + 1, c), {}), [fleet]);
  const shown = fleet
    .filter(b => plat === "all" || b.pkey === plat)
    .filter(b => !states.length || states.includes(b.state))
    .filter(b => !q || b.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => sort === "hot" ? (SEVERITY[b.state] - SEVERITY[a.state]) || ((b.temp ?? -1) - (a.temp ?? -1)) : a.name.localeCompare(b.name, undefined, { numeric:true }));
  const platKeys = ["all", ...new Set(fleet.map(b => b.pkey))];
  const toggle = st => setStates(xs => xs.includes(st) ? xs.filter(x => x !== st) : [...xs, st]);
  const filtered = plat !== "all" || states.length || q;
  const updated = fin(reader.now) ? hhmmss(reader.now * 1000) + " UTC" : "";
  const eyebrow = !doc ? (err ? "Reader not answering · " + err : "Connecting to the fleet reader…")
    : err ? `Reader not answering · showing ${updated}` : `Live · ${fleet.length} machine${fleet.length === 1 ? "" : "s"} · updated ${updated}`;
  return html`<section>
    <div class="titlebar">
      <div><span class=${"eyebrow livebar" + (err ? " down" : "")} role="status">${eyebrow}</span><h1>Heat Governor</h1></div>
    </div>
    <div class="card"><${Flow} fleet=${fleet} /></div>

    <div class="summary" role="group" aria-label="Filter by state">
      ${STATES.filter(st => counts[st]).map(st => html`
        <button key=${st} class=${"chip " + st} aria-pressed=${states.includes(st)} onClick=${() => toggle(st)}><b>${counts[st]}</b>${st === "unsupported" ? "not supported" : st}</button>`)}
    </div>
    <div class="filters">
      <div class="pills sm" role="group" aria-label="Platform">
        ${platKeys.map(p => html`
          <button key=${p} aria-pressed=${plat === p} onClick=${() => setPlat(p)}>${p === "all" ? "All" : platLabel(p)}<span class="n">${p === "all" ? fleet.length : platCounts[p]}</span></button>`)}
      </div>
      <input id="machine-search" class="search" type="search" placeholder="Find a machine" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Find a machine" />
      <div class="pills sm" role="group" aria-label="Sort">
        <button aria-pressed=${sort === "hot"} onClick=${() => setSort("hot")}>Hottest first</button>
        <button aria-pressed=${sort === "name"} onClick=${() => setSort("name")}>Name</button>
      </div>
      <div class="pills sm" role="group" aria-label="View">
        <button aria-pressed=${view === "rows"} onClick=${() => { setView("rows"); store.set("hg-view", "rows"); }}>Rows</button>
        <button aria-pressed=${view === "grid"} onClick=${() => { setView("grid"); store.set("hg-view", "grid"); }}>Grid</button>
      </div>
      <span class="count">${shown.length} of ${fleet.length}${filtered ? html` <button class="clear" onClick=${() => { setPlat("all"); setStates([]); setQ(""); }}>Clear</button>` : ""}</span>
    </div>
    ${!fleet.length ? html`<div class="empty">${doc ? "No machines in the fleet file." : "Waiting for the fleet reader…"}</div>` :
      !shown.length ? html`<div class="empty">No machine matches these filters.</div>` :
      view === "rows" ? html`<div class="lanes">${shown.map(b => html`<${Lane} b=${b} key=${b.name} open=${picked.includes(b.name)} onOpen=${onOpen} />`)}</div>`
                      : html`<div class="tiles">${shown.map(b => html`<${Tile} b=${b} key=${b.name} open=${picked.includes(b.name)} onOpen=${onOpen} />`)}</div>`}
    ${items.length > 0 && html`<${Detail} items=${items} slots=${slots} fleet=${fleet} nowS=${nowS} keptS=${reader.history_s} onClose=${() => setSel({ picked: [], slots: {} })} onAdd=${add} onRemove=${remove} />`}
  </section>`;
}

function App() {
  const [pref, setPrefS] = useState(() => { const v = store.get("hg-mode", "system"); return ["system", "light", "dark"].includes(v) ? v : "system"; });
  const mode = useMode(pref);
  const { doc, err } = useFleet();
  const setPref = k => { setPrefS(k); store.set("hg-mode", k); };
  useEffect(() => { document.documentElement.dataset.mode = mode; }, [mode]);
  return html`<${React.Fragment}>
    <header class="app-header">
      <div class="brand"><span class="mark rune" aria-hidden="true">ᚲ</span>heat-governor</div>
      <div class="pills sm" role="group" aria-label="Appearance">
        ${[["system", "Auto"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => html`<button key=${k} aria-pressed=${pref === k} onClick=${() => setPref(k)}>${l}</button>`)}
      </div>
    </header>
    <main><${Machines} doc=${doc} err=${err} /></main>
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
