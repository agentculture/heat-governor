<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- heat-governor mesh serve dashboard. Built from the locked design in docs/design/fleet-dashboard.html
     (Machines view, Polar night skin only). Live data from /api/fleet and /api/history on this origin;
     React 18.3.1, htm 3.1.1 and Lato are vendored under /vendor/ (see vendor/README.txt). -->
<title>Heat Governor</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family:"Lato"; font-style:normal; font-weight:300; font-display:swap; src:url(/vendor/lato-latin-300.woff2) format("woff2") }
@font-face { font-family:"Lato"; font-style:normal; font-weight:400; font-display:swap; src:url(/vendor/lato-latin-400.woff2) format("woff2") }
@font-face { font-family:"Lato"; font-style:normal; font-weight:700; font-display:swap; src:url(/vendor/lato-latin-700.woff2) format("woff2") }
@font-face { font-family:"Lato"; font-style:normal; font-weight:900; font-display:swap; src:url(/vendor/lato-latin-900.woff2) format("woff2") }
/* Polar night. Light (cream) is :root; dark (slate) is html[data-mode="dark"]. data-mode is resolved in
   script from the host's data-theme or prefers-color-scheme (Auto), or forced by the Light/Dark pills. */
:root { color-scheme: light;
  --s1:#e06a2a; --s2:#5a6bb5;
  --bg:#f5f0e6; --surface:#fbf8f1; --surface-2:#f7f2e9; --raise:#ece5d7;
  --ink:#38362f; --ink-soft:#6c675d; --ink-faint:#9f998c;
  --line:rgba(56,54,47,.08); --line-strong:rgba(56,54,47,.14);
  --cool:#3a8fb8; --warm:#c27a24; --hot:#d23f25; --accent:#e06a2a; --accent-tint:rgba(224,106,42,.08);
  --heat:linear-gradient(90deg,#a9d6ec,#5b8fb0 30%,#8b6f80 52%,#d8643f 72%,#e06a2a 86%,#f0a050);
  --dim:rgba(251,248,241,.86); --header:rgba(245,240,230,.86); --glow:none;
  --radius:16px; --ease:cubic-bezier(.22,1,.36,1);
  --font-body:"Lato",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --lv-cool:var(--cool); --lv-warm:var(--warm); --lv-hot:color-mix(in srgb,var(--hot) 55%,var(--warm)); --lv-critical:var(--hot);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6 }
html[data-mode="dark"] { color-scheme:dark;
  --s1:#e06a2a; --s2:#7282e0;
  --bg:#0e1117; --surface:#151922; --surface-2:#1b202b; --raise:#252b39;
  --ink:#e9ebf0; --ink-soft:#9ba2b0; --ink-faint:#646b79;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --cool:#8ecbe8; --warm:#f2a65a; --hot:#ff5a3c; --accent:#ff8a3d; --accent-tint:rgba(255,138,61,.10);
  --heat:linear-gradient(90deg,#8ecbe8,#5b8fb0 30%,#7a5a6e 52%,#d8643f 72%,#ff8a3d 86%,#ffc27a);
  --dim:rgba(21,25,34,.86); --header:rgba(14,17,23,.82);
  --glow:radial-gradient(70% 100% at 50% 100%, rgba(255,138,61,.07), transparent 70%);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9 }

* { box-sizing:border-box }
html { background:var(--bg); transition:background .4s var(--ease) }
body { margin:0; min-height:100%; color:var(--ink); background:var(--bg); font-family:var(--font-body); font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .4s var(--ease), color .4s var(--ease) }
body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; background:var(--glow) }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:6px }
code, .mono { font-family:var(--font-mono); font-size:.84em }
code { color:var(--ink-soft); overflow-wrap:anywhere }
.rune { font-family:"Segoe UI Historic","Noto Sans Runic","Junicode",serif; font-weight:400 }
button { font:inherit }

.app-header { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px 16px; flex-wrap:wrap;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--header); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line) }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg) }
@media (min-width:720px){ .app-header{ padding-left:max(40px,env(safe-area-inset-left,0px)); padding-right:max(40px,env(safe-area-inset-right,0px)) } }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; color:var(--ink-soft) }
.brand .mark { color:var(--accent); font-size:17px; width:18px; text-align:center }
.pills { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--surface); border:1px solid var(--line); overflow-x:auto; max-width:100% }
.pills button { appearance:none; border:0; background:transparent; color:var(--ink-soft); font-size:14px; padding:6px 15px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:color .25s var(--ease), background .25s var(--ease) }
.pills button:hover { color:var(--ink) }
.pills button[aria-pressed="true"], .pills button[aria-current="page"] { background:var(--raise); color:var(--ink); font-weight:700 }
.pills.sm button { font-size:13px; padding:5px 12px }
.pills .n { font-variant-numeric:tabular-nums; color:var(--ink-faint); margin-left:5px; font-weight:400 }

main { padding-block:32px 80px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); max-width:74rem; margin:0 auto }
@media (min-width:720px){ main{ padding-left:max(40px,env(safe-area-inset-left,0px)); padding-right:max(40px,env(safe-area-inset-right,0px)) } }
.titlebar { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px }
h1 { font-weight:900; font-size:clamp(2rem,4.6vw,2.8rem); line-height:1.05; letter-spacing:-.02em; margin:.25rem 0 0 }
h2 { font-weight:700; font-size:1.1rem; margin:2.6rem 0 1rem }
.lede { font-size:1.05rem; color:var(--ink-soft); max-width:44rem; margin:-.4rem 0 1.6rem; font-weight:300 }
.eyebrow { font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint) }


.card { min-width:0; padding:1.4rem 1.6rem; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); transition:background .4s var(--ease) }
.flow { overflow-x:auto }
.flow svg { display:block; min-width:640px; width:100% }

/* summary + filters */
.summary { display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 12px }
.chip { --m:var(--ink-faint); appearance:none; display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:12px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); font-size:.86rem; transition:border-color .2s, background .2s }
.chip b { font-size:1.15rem; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums }
.chip::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--m) }
.chip.cool { --m:var(--cool) } .chip.warm { --m:var(--warm) } .chip.hot { --m:var(--hot) } .chip.critical { --m:var(--hot) }
.chip.critical::before { box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 25%,transparent) }
.chip.unreachable::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.chip[aria-pressed="true"] { border-color:var(--m); background:color-mix(in srgb,var(--m) 9%,var(--surface)) }
.chip:disabled { opacity:.45; cursor:default }
.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px }
.search { flex:1 1 12rem; min-width:0; max-width:18rem; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px }
.search::placeholder { color:var(--ink-faint) }
.count { font-size:.82rem; color:var(--ink-faint); margin-left:auto }
.clear { appearance:none; border:0; background:none; color:var(--accent); cursor:pointer; font-size:.82rem; padding:4px 6px }

/* machine rows */
.lanes { display:grid; gap:10px }
.lane { --m:var(--ink-faint);
  display:grid; grid-template-columns:200px minmax(0,1fr) 310px; gap:26px; align-items:center;
  padding:18px 24px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line);
  transition:border-color .3s var(--ease), background .4s var(--ease) }
.lane:hover { border-color:var(--line-strong); background:var(--surface-2) }
.cool { --m:var(--cool) } .warm { --m:var(--warm) } .hot, .critical { --m:var(--hot) }
.lane.critical { border-color:color-mix(in srgb,var(--hot) 45%,transparent) }
.lane.unreachable { border-style:dashed; background:transparent }
.lane.unreachable .temp, .lane.unreachable .scale { opacity:.45 }
@media (max-width:900px){ .lane{ grid-template-columns:1fr; gap:14px; padding:18px } }
.who { display:grid; gap:1px; min-width:0 }
.who .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.who .mark { font-size:17px; color:var(--m); width:22px; text-align:center }
.who .name { font-weight:700; font-size:1.12rem }
.who .sub { font-size:.78rem; color:var(--ink-soft); padding-left:32px }
.who .sub.faint { color:var(--ink-faint) }
.tag { font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); border:1px solid var(--line-strong); border-radius:999px; padding:1px 7px }
.status { display:inline-flex; align-items:center; gap:7px; font-size:.8rem; color:var(--m); font-weight:700 }
.status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--m); box-shadow:0 0 0 4px color-mix(in srgb,var(--m) 16%,transparent) }
.unreachable .status::before { background:transparent; border:1.5px dashed var(--ink-faint); box-shadow:none }
.meter { min-width:0 }
.readout { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap }
.temp { font-variant-numeric:tabular-nums; font-weight:300; font-size:2.1rem; line-height:1; letter-spacing:-.02em }
.temp small { font-size:.85rem; color:var(--ink-faint); margin-left:3px }
.why { font-size:.8rem; color:var(--ink-faint) }
.scale { position:relative; height:6px; border-radius:999px; background:var(--heat); margin:13px 0 6px }
.scale .dim { position:absolute; top:0; bottom:0; right:0; background:var(--dim); border-radius:0 999px 999px 0 }
.scale .head { position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--surface); border:3px solid var(--m) }
.scale .band { position:absolute; top:-4px; bottom:-4px; border-inline:1px solid var(--ink-faint); background:color-mix(in srgb,var(--ink) 7%,transparent); border-radius:3px }
.scale.off { background:none; border:1px dashed var(--line-strong); height:6px }
.lane.unsupported, .tile.unsupported { border-style:dashed; background:transparent }
.unsupported .status::before { background:transparent; border:1.5px dashed var(--ink-faint); box-shadow:none }
.chip.unsupported::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.gpus { display:inline-flex; gap:3px; vertical-align:middle }
.gpus i { width:12px; height:12px; border-radius:3px }
.tile .gpus i { width:100%; height:8px } .tile .gpus { display:grid; grid-template-columns:repeat(8,1fr) }
.ticks { position:relative; height:16px; font-size:.68rem; color:var(--ink-faint); font-variant-numeric:tabular-nums }
.ticks span { position:absolute; white-space:nowrap }
.facts { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; min-width:0; font-size:.82rem }
.facts dt { color:var(--ink-faint) } .facts dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; color:var(--ink-soft) }

/* machine tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr)); gap:10px }
.tile { --m:var(--ink-faint); padding:16px 16px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); display:grid; gap:6px; min-width:0 }
.tile.critical { border-color:color-mix(in srgb,var(--hot) 45%,transparent) }
.tile.unreachable { border-style:dashed; background:transparent }
.tile .row { display:flex; justify-content:space-between; align-items:center; gap:8px }
.tile .nm { font-weight:700; display:flex; gap:8px; align-items:center; min-width:0 }
.tile .nm .mark { color:var(--m) }
.tile .temp { font-size:1.7rem }
.tile .scale { margin:6px 0 2px; height:4px }
.tile .scale .head { width:10px; height:10px; margin:-5px 0 0 -5px; border-width:2px }
.tile .meta { font-size:.72rem; color:var(--ink-faint); overflow-wrap:anywhere }
.empty { padding:40px; text-align:center; color:var(--ink-faint); border:1px dashed var(--line-strong); border-radius:var(--radius) }


/* info hints */
.info { position:relative; display:inline-flex; vertical-align:1px; margin-left:5px; cursor:help; border-radius:50% }
.info .i { display:inline-grid; place-items:center; width:14px; height:14px; border-radius:50%; border:1px solid var(--line-strong); color:var(--ink-faint); font-size:9px; font-weight:700; font-style:normal; line-height:1 }
.info:hover .i, .info:focus-visible .i { color:var(--ink); border-color:var(--ink-faint) }
.info .tipx { position:absolute; left:-6px; bottom:calc(100% + 8px); width:min(250px,70vw); padding:9px 11px; border-radius:10px; z-index:30;
  background:var(--surface-2); border:1px solid var(--line-strong); box-shadow:0 8px 24px rgba(0,0,0,.18); color:var(--ink-soft); font-size:.76rem; font-weight:400; line-height:1.45; text-transform:none; letter-spacing:0;
  opacity:0; visibility:hidden; transform:translateY(3px); transition:opacity .18s var(--ease), transform .18s var(--ease), visibility .18s }
.info:hover .tipx, .info:focus .tipx { opacity:1; visibility:visible; transform:none }

/* selectable machines */
.lane, .tile { cursor:pointer }
.lane:focus-visible, .tile:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
.lane[data-open="true"], .tile[data-open="true"] { border-color:var(--accent) }

/* detail drawer */
.scrim { position:fixed; inset:0; pointer-events:none; background:rgba(0,0,0,.12); z-index:20; animation:fade .25s var(--ease) }
.drawer { position:fixed; top:0; right:0; bottom:0; z-index:21; width:min(800px,100vw); background:var(--bg); border-left:1px solid var(--line);
  box-shadow:-20px 0 60px rgba(0,0,0,.25); overflow-y:auto; overscroll-behavior:contain; animation:slide .35s var(--ease);
  padding-top:max(20px,env(safe-area-inset-top,0px)); padding-bottom:max(32px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
@media (min-width:720px){ .drawer{ padding-left:28px; padding-right:max(28px,env(safe-area-inset-right,0px)) } }
@keyframes slide { from { transform:translateX(28px); opacity:0 } }
@keyframes fade { from { opacity:0 } }
.dh { display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
.dh h2 { margin:.2rem 0 0; font-size:1.7rem; font-weight:900; display:flex; gap:10px; align-items:center; flex-wrap:wrap }
.dh h2 .mark { color:var(--m); font-weight:400 }
.dh .sub { color:var(--ink-soft); font-size:.85rem }
.dnow { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin:12px 0 16px }
.xbtn { appearance:none; flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:20px; line-height:1 }
.xbtn:hover { border-color:var(--line-strong) }
.drow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin:0 0 12px }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:12px }
@media (max-width:600px){ .stats{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.stat { padding:12px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); min-width:0 }
.stat b { display:block; font-size:1.4rem; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-.01em; color:var(--ink) }
.stat span { font-size:.72rem; color:var(--ink-faint) }
.chartcard { position:relative; padding:14px 14px 10px; border-radius:14px; background:var(--surface); border:1px solid var(--line); margin-bottom:12px; min-width:0 }
.chartcard h3 { margin:0 0 8px; font-size:.86rem; font-weight:700 }
.chartcard svg.trend { display:block; width:100%; height:auto; touch-action:pan-y; outline:none }
.chartcard svg.trend:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:6px }
.chartcard svg text { font-family:var(--font-body); font-size:11px; fill:var(--ink-faint); font-variant-numeric:tabular-nums }
.chartcard svg text.end { font-size:11.5px; font-weight:700; fill:var(--ink-soft) }
.legend2 { display:flex; gap:16px; flex-wrap:wrap; font-size:.76rem; color:var(--ink-soft); margin:0 0 6px }
.legend2 i { display:inline-block; width:14px; height:2px; border-radius:2px; margin-right:6px; vertical-align:middle }
.legend2 i.sw { width:10px; height:10px; border-radius:3px; vertical-align:-1px }
.tip { position:absolute; top:44px; pointer-events:none; min-width:160px; padding:9px 11px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line-strong);
  box-shadow:0 8px 24px rgba(0,0,0,.18); font-size:.78rem; color:var(--ink-soft); z-index:2 }
.tip .tt { color:var(--ink-faint); margin-bottom:4px; font-size:.72rem }
.tip .r { display:flex; align-items:center; gap:12px; justify-content:space-between; white-space:nowrap }
.tip .r b { color:var(--ink); font-variant-numeric:tabular-nums }
.tip .r i { width:12px; height:2px; display:inline-block; margin-right:6px; vertical-align:middle; border-radius:2px }
.tip .r i.sw { width:8px; height:8px; border-radius:2px }
.seg2 { display:flex; height:20px; gap:2px }
.seg2 span { display:block; min-width:3px; border-radius:3px }
.sharelab { display:flex; gap:16px; flex-wrap:wrap; font-size:.76rem; color:var(--ink-soft); margin-top:8px }
.sharelab i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px }
.sharelab b { color:var(--ink); font-variant-numeric:tabular-nums; margin-right:3px }
.minis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 14px }
@media (max-width:600px){ .minis{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.mini { font-size:.72rem; color:var(--ink-faint); min-width:0 } .mini svg { display:block; width:100%; height:36px } .mini b { color:var(--ink) }
.tablewrap { overflow-x:auto }
table.dt { width:100%; border-collapse:collapse; font-size:.8rem; font-variant-numeric:tabular-nums }
.dt th, .dt td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap }
.dt th:first-child, .dt td:first-child { text-align:left }
.dt th { color:var(--ink-faint); font-weight:700 } .dt td { color:var(--ink-soft) }
.linkbtn { appearance:none; border:0; background:none; color:var(--accent); cursor:pointer; font-size:.82rem; padding:4px 2px }
.nodata { padding:44px 20px; text-align:center; color:var(--ink-faint); border:1px dashed var(--line-strong); border-radius:14px }
@media (max-width:900px){ .scrim { pointer-events:auto; background:rgba(0,0,0,.3) } }
.drow-l { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.hint { font-size:.74rem; color:var(--ink-faint); margin:-4px 0 12px }
@media (max-width:900px){ .hint { display:none } }
.srcnote { font-size:.74rem; color:var(--ink-faint); margin:8px 2px 0 }
.picker { position:relative }
.addbtn { appearance:none; border:1px dashed var(--line-strong); background:transparent; color:var(--ink-soft); border-radius:999px; padding:5px 13px; font-size:13px; cursor:pointer; transition:border-color .2s, color .2s }
.addbtn:hover:not(:disabled) { border-color:var(--accent); color:var(--ink) }
.addbtn:disabled { opacity:.55; cursor:default }
.pop { position:absolute; top:calc(100% + 6px); left:0; z-index:5; width:min(300px,80vw); padding:8px; border-radius:14px; background:var(--surface); border:1px solid var(--line-strong); box-shadow:0 14px 40px rgba(0,0,0,.2) }
.pop .search { max-width:none; width:100%; margin-bottom:6px }
.opts { max-height:280px; overflow-y:auto; display:grid; gap:2px }
.opt2 { --m:var(--ink-faint); appearance:none; display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:8px; align-items:center; width:100%; text-align:left; border:0; background:transparent; color:var(--ink); padding:7px 8px; border-radius:8px; cursor:pointer; font-size:.86rem }
.opt2:hover:not(:disabled) { background:var(--surface-2) }
.opt2:disabled { opacity:.45; cursor:default }
.opt2 .meta { font-size:.74rem; color:var(--ink-faint); white-space:nowrap }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px }

.mchip button, .rm { appearance:none; border:0; background:transparent; color:var(--ink-faint); width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:15px; line-height:1 }
.mchip button:hover, .rm:hover { background:var(--raise); color:var(--ink) }
i.key { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:7px; vertical-align:middle }

.lvrows { display:grid; gap:8px }

/* boundaries: usage bar (solid boundary mark, dashed far-over mark) and a left-aligned rules table */
.ubar { position:relative; height:6px; border-radius:999px; background:var(--raise); margin:4px 0 6px }
.ubar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--m) }

.rules th { text-align:left; font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap }

.rules .rn { font-weight:700 }
.rules .mt { display:flex; gap:4px 10px; flex-wrap:wrap; max-width:260px }
.rules .usage { min-width:200px }
.rules .note { font-size:.74rem; color:var(--ink-faint) }
.idle { --m:var(--ink-faint) }
.status.idle::before, .chip.idle::before { background:transparent; border:1.5px dashed var(--ink-faint); box-shadow:none }
.bcard.unreachable, .bcard.stale, .bcard.unsupported { border-style:dashed; background:transparent }

/* boundaries editor: buttons, icon buttons, form fields and the modal dialog (existing tokens only) */
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0 }
.ico { flex:none; display:inline-block; vertical-align:-3px }
.btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:0 18px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:.88rem; font-weight:700; cursor:pointer; white-space:nowrap; transition:border-color .2s, background .2s }
.btn:hover:not(:disabled) { border-color:var(--ink-faint) }
.btn:disabled { opacity:.5; cursor:default }
.btn.primary { background:var(--ink); border-color:var(--ink); color:var(--bg) }
.btn.danger { background:var(--hot); border-color:var(--hot); color:#fff }
html[data-mode="dark"] .btn.danger { color:var(--bg) }
.btn.sm { min-height:32px; padding:0 13px; font-size:.8rem }
.ibtn { appearance:none; display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer }
.ibtn:hover { color:var(--ink); border-color:var(--line-strong) }
.back { display:inline-flex; align-items:center; gap:6px; font-size:.84rem; font-weight:700; color:var(--accent); text-decoration:none }
.back:hover { color:var(--ink) }
h1[tabindex="-1"]:focus { outline:none }
.cardact { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.ed-grid { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start }
.ed-form { flex:1 1 380px; display:grid; gap:18px }
.ed-preview { flex:999 1 420px }
.ed-preview h2, .card h2.sub2 { margin:0 0 6px; font-size:1.05rem }
.ed-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-items:start }
@media (max-width:600px){ .ed-pair { grid-template-columns:1fr } }
.field { display:grid; gap:6px; min-width:0 }

.input { width:100%; min-width:0; min-height:40px; padding:0 12px; border-radius:12px; border:1px solid var(--line-strong); background:var(--bg); color:var(--ink); font:inherit; font-size:15px }
.input.mono { font-family:var(--font-mono); font-size:14px }
.input[readonly] { background:var(--surface-2); color:var(--ink-soft) }
.input[aria-invalid="true"] { border-color:var(--hot); box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 15%,transparent) }

.inrow { display:flex; gap:8px }
.chips.plain { list-style:none; padding:0; margin:0 }
.callout { display:flex; gap:10px; align-items:flex-start; margin:0; padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:.84rem; color:var(--ink-soft) }
.callout.warn { border-color:color-mix(in srgb,var(--hot) 40%,transparent) }
.callout ul { margin:4px 0 0; padding-left:18px }
.ed-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-end }
.ed-status { margin:0; min-height:1.4em; font-size:.84rem; color:var(--ink-soft) }
.ed-status[data-state="saved"] { color:var(--cool) }
.ed-status[data-state="not_saved"] { color:var(--hot) }
.ed-status[data-state="conflict"] { color:var(--warm) }
.flash { margin:0 0 14px; padding:10px 14px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); font-size:.86rem }
.rules .cmd { max-width:22rem; overflow-wrap:anywhere; white-space:normal }
.tokbox { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end }
.tokbox .field { flex:1 1 14rem }
.modal-scrim { position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:16px; background:rgba(0,0,0,.35); animation:fade .2s var(--ease) }
.modal { --m:var(--ink-soft); width:min(34rem,100%); max-height:calc(100vh - 32px); overflow-y:auto; display:grid; gap:14px; padding:24px; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--line-strong); box-shadow:0 24px 60px rgba(0,0,0,.3) }
.modal.danger { --m:var(--hot); border-color:color-mix(in srgb,var(--hot) 45%,transparent) }
.modal.warn { --m:var(--warm) }
.modal h2 { margin:0; font-size:1.2rem }
.modal p { margin:0; color:var(--ink-soft); font-size:.9rem }
.mmark { display:inline-grid; place-items:center; width:40px; height:40px; border-radius:12px; background:color-mix(in srgb,var(--m) 14%,transparent); color:var(--m) }
.modal .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end }
.plist { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 14px; margin:0; padding:12px 14px; list-style:none; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:.82rem; font-variant-numeric:tabular-nums }
.plist li { display:contents }
.plist b { color:var(--hot) }

/* heat aura: grows with level; only critical moves */
.lane.warm, .tile.warm { box-shadow:0 0 26px -14px var(--warm) }
.lane.hot, .tile.hot { border-color:color-mix(in srgb,var(--hot) 30%,transparent); box-shadow:0 0 34px -12px var(--hot) }
.lane.critical, .tile.critical { box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 12%,transparent), 0 0 44px -10px var(--hot); animation:aura 2.4s ease-in-out infinite }
@keyframes aura {
  0%, 100% { box-shadow:0 0 0 0 color-mix(in srgb,var(--hot) 0%,transparent), 0 0 30px -12px var(--hot) }
  50% { box-shadow:0 0 0 4px color-mix(in srgb,var(--hot) 14%,transparent), 0 0 48px -8px var(--hot) } }
/* stale machines: last reading kept, drawn dashed like unreachable */
.lane.stale, .tile.stale { border-style:dashed; background:transparent }
.lane.stale .temp, .lane.stale .scale, .tile.stale .temp, .tile.stale .scale { opacity:.6 }
.tile.unreachable .temp, .tile.unreachable .scale { opacity:.45 }
.stale .status::before { background:transparent; border:1.5px dashed var(--m); box-shadow:none }
.chip.stale::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.stale { --m:var(--ink-soft) }
.livebar { display:inline-flex; align-items:center; gap:8px }
.livebar.down { color:var(--hot) }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important }
  .lane.critical, .tile.critical { box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 12%,transparent), 0 0 44px -10px var(--hot) } }
</style>

<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.js"></script>
<script>
"use strict";
const html = htm.bind(React.createElement);
const { useState, useEffect, useMemo, useRef } = React;
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const PLATFORM_LABEL = { ventunoq:"VENTUNO Q", spark:"Spark", thor:"Thor", orin:"Orin", nano:"Orin Nano", generic:"Generic", windows:"Windows" };
const titleCase = s => String(s || "unknown").replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const platLabel = p => PLATFORM_LABEL[p] || titleCase(p);
// Elder Futhark initial of the machine's name: c→ᚲ, s→ᛋ, th→ᚦ, o→ᛟ, n→ᚾ, m→ᛗ, h→ᚺ, g→ᚷ, e→ᛖ
const rune = n => n.startsWith("th") ? "ᚦ" : ({ c:"ᚲ", s:"ᛋ", o:"ᛟ", n:"ᚾ", m:"ᛗ", h:"ᚺ", g:"ᚷ", e:"ᛖ" })[n[0]] || "ᚠ";
const fmt = (n, d=1) => n == null ? "—" : Number(n).toFixed(d);
const fin = v => Number.isFinite(v);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SEVERITY = { critical:6, hot:5, warm:4, unreachable:3, stale:2.5, unsupported:2, cool:0 };
const STATES = ["critical", "hot", "warm", "cool", "stale", "unreachable", "unsupported"];
const LEVELS = ["cool", "warm", "hot", "critical"];

// ---- /api/fleet machine -> one row of the UI ----
const field = (t, k) => (t ? t[k] : null);
const num = (t, k) => (t && fin(t[k]) ? t[k] : null);
function boxState(m, t) {
  if (m.state === "unsupported") return "unsupported";
  if (m.state === "ok") return LEVELS.includes(t && t.level) ? t.level : "stale";
  return m.state === "stale" ? "stale" : "unreachable";
}
const platformKey = (t, unsupported) => (t && t.platform) || (unsupported ? "unsupported" : "unknown");
const limitsOf = t => (t && t.limits && fin(t.limits.warm_c) && fin(t.limits.crit_c) ? t.limits : null);
const gpusOf = t => (t && Array.isArray(t.gpus_c) && t.gpus_c.length ? t.gpus_c : null);
const containersOf = t => (t && Array.isArray(t.containers) ? t.containers : []);
const memOf = t => (t && t.memory && typeof t.memory === "object" && fin(t.memory.used_pct) ? t.memory : null);
function peerOf(t) {
  const pair = t && t.pair && typeof t.pair === "object" ? t.pair : null;
  if (!pair) return { name: null, status: null };
  return { name: pair.peer_host || pair.peer || "peer", status: pair.peer_status };
}
function toBox(m) {
  const t = m.thermal || null;
  const unsupported = m.state === "unsupported";
  const peer = peerOf(t);
  return {
    name: m.name, transport: m.transport, host: m.host, hub: m.transport === "local",
    pkey: platformKey(t, unsupported),
    state: boxState(m, t), age: m.age_s, health: m.health || {},
    // no made-up reading: unsupported machines show none, unreachable ones their last
    temp: unsupported ? null : num(t, "temp_c"),
    gpu_temp: unsupported ? null : num(t, "gpu_temp_c"),
    gpus: gpusOf(t),
    limits: unsupported ? null : limitsOf(t),
    level: field(t, "level"), admit: field(t, "admit"), cf: field(t, "concurrency_factor"),
    reason: field(t, "reason"), rate: num(t, "rate_c_s"),
    containers: containersOf(t), applying: !!(t && t.applying),
    version: field(t, "version"), zone: field(t, "hottest_zone"), gpu_clock: field(t, "gpu_clock"),
    gpu_mhz: num(t, "gpu_mhz"), gpu_power_w: num(t, "gpu_power_w"),
    gpu_util_pct: num(t, "gpu_util_pct"),
    fan_rpm: num(t, "fan_rpm"), power_w: num(t, "power_w"),
    zones: num(t, "zones"),
    pair: peer.name, pair_status: peer.status,
    mem: memOf(t),
    hasReading: !!t,
  };
}
// "91% · 10.7 GiB free of 122 GiB" (+ " · DDR 46 °C" only where the board exposes a memory zone)
const gib = v => fmt(v / 1024, v >= 100 * 1024 ? 0 : 1) + "\u00a0GiB";
function freeText(m) {
  if (!fin(m.avail_mib)) return "";
  const total = fin(m.total_mib) ? " of\u00a0" + gib(m.total_mib) : "";
  return " · " + gib(m.avail_mib) + "\u00a0free" + total;
}
function memText(b) {
  const m = b.mem;
  if (!m) return "—";
  return fmt(m.used_pct, 0) + "%" + freeText(m) + (fin(m.temp_c) ? " · DDR\u00a0" + fmt(m.temp_c, 0) + "\u00a0°C" : "");
}

// ---- live data ----
function useFleet() {
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    let alive = true, timer = null;
    const tick = async () => {
      let wait = 5;
      try {
        const r = await fetch("/api/fleet", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        if (!alive) return;
        setDoc(d); setErr(null);
        wait = clamp(Number(d.reader && d.reader.poll_s) || 5, 2, 10);
      } catch (e) { if (alive) setErr(String((e && e.message) || e)); }
      if (alive) timer = setTimeout(tick, wait * 1000);
    };
    tick();
    return () => { alive = false; clearTimeout(timer); };
  }, []);
  return { doc, err };
}

const HISTORY_REFRESH_MS = 15000;
function useHistory(names, rk) {
  const [data, setData] = useState({});
  const [src, setSrc] = useState({});
  const key = names.join("\n") + "|" + rk;
  useEffect(() => {
    let alive = true, timer = null;
    const load = async () => {
      await Promise.all(names.map(async n => {
        try {
          const r = await fetch("/api/history?machine=" + encodeURIComponent(n) + "&range=" + rk, { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          if (alive) setData(o => ({ ...o, [n + "|" + rk]: Array.isArray(d.samples) ? d.samples : [] }));
          if (alive) setSrc(o => ({ ...o, [n + "|" + rk]: d.source }));
        } catch (e) { /* keep what is shown; the next refresh retries */ }
      }));
      if (alive) timer = setTimeout(load, HISTORY_REFRESH_MS);
    };
    load();
    return () => { alive = false; clearTimeout(timer); };
  }, [key]);
  const of = n => data[n + "|" + rk];
  of.src = n => src[n + "|" + rk];
  return of;
}

// ---- theme mode: Auto follows the host theme, Light/Dark override ----
function useMode(pref) {
  const sys = () => { const t = document.documentElement.dataset.theme; if (t === "dark" || t === "light") return t;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; };
  const [sysMode, setSys] = useState(sys);
  useEffect(() => {
    const mq = matchMedia("(prefers-color-scheme: dark)"); const on = () => setSys(sys());
    mq.addEventListener("change", on);
    const mo = new MutationObserver(on); mo.observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
    return () => { mq.removeEventListener("change", on); mo.disconnect(); };
  }, []);
  return pref === "system" ? sysMode : pref;
}

// where the single band label sits: right-aligned near the top, left-aligned near the bottom, else centred
function bandAnchor(a, z) {
  const mid = (a + z) / 2;
  if (mid > 85) return { right: (100 - z) + "%" };
  if (mid < 15) return { left: a + "%" };
  return { left: mid + "%", transform: "translateX(-50%)" };
}
function Scale({ temp, limits, lo = 30, hi, small }) {
  hi = hi || Math.max(110, (limits && limits.crit_c + 6) || 110);
  const pct = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  if (temp == null) {
    const ticks = !small && html`<div class="ticks"><span style=${{ left: 0 }}>no reading</span></div>`;
    return html`<div><div class="scale off" role="img" aria-label="no reading"></div>${ticks}</div>`;
  }
  // one band from warm to crit with a single label, so close limits never collide
  const a = limits ? pct(limits.warm_c) : null, z = limits ? pct(limits.crit_c) : null;
  const label = fmt(temp) + " °C" + (limits ? ", warm to critical band " + limits.warm_c + " to " + limits.crit_c + " °C" : "");
  const band = limits && html`<div class="band" style=${{ left: a + "%", width: (z - a) + "%" }}></div>`;
  const ticks = !small && limits && html`<div class="ticks"><span style=${bandAnchor(a, z)}>${limits.warm_c}–${limits.crit_c}°</span></div>`;
  return html`<div>
    <div class="scale" role="img" aria-label=${label}>
      <div class="dim" style=${{ left: pct(temp) + "%" }}></div>
      ${band}
      <div class="head" style=${{ left: pct(temp) + "%" }}></div>
    </div>
    ${ticks}
  </div>`;
}

const Mark = ({ b }) => html`<span class="mark rune" aria-hidden="true">${rune(b.name)}</span>`;
function ageText(s) {
  if (s == null) return "";
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  return Math.round(s / 3600) + "h";
}
function statusText(b) {
  if (b.state === "unreachable") return b.hasReading ? "unreachable · " + ageText(b.age) : "unreachable";
  if (b.state === "stale") return "stale · " + ageText(b.age);
  if (b.state === "unsupported") return "not supported";
  return b.state;
}
function rateText(r) {
  if (r == null) return "";
  return " · " + (r > 0 ? "+" : "") + fmt(r, 2) + " °C/s";
}
function whyText(b) {
  if (b.state === "unsupported") return "heat-governor can't read this machine";
  if (b.state === "unreachable" || b.state === "stale") return b.hasReading ? "last reading shown" : "no readings";
  return (b.reason || "steady") + rateText(b.rate);
}
const subLine = b => b.state === "unsupported" ? "not supported" : [platLabel(b.pkey), b.version ? "v" + b.version : ""].filter(Boolean).join(" · ");
const viaLine = b => b.hub ? "this machine · local" : (b.host || b.name) + " · " + (b.transport || "ssh");
// per-GPU strip for multi-GPU boxes: one cell per GPU, coloured against the box's limits
function gpuColour(t, limits) {
  if (t >= limits.crit_c) return "var(--hot)";
  if (t >= limits.warm_c) return "var(--warm)";
  return "var(--cool)";
}
function Gpus({ b }) {
  if (!b.gpus || !b.limits) return null;
  const cells = b.gpus.map((t, i) => html`<i key=${i} title=${"GPU " + i + ": " + fmt(t, 0) + " °C"}
    style=${{ background: gpuColour(t, b.limits), opacity: .35 + .65 * Math.min(1, Math.max(0, (t - 55) / 35)) }}></i>`);
  return html`<span class="gpus" role="img" aria-label=${"GPU temperatures: " + b.gpus.map(t => fmt(t, 0)).join(", ") + " °C"}>
    ${cells}</span>`;
}

// small (i) hint: hover or focus shows a plain-language explanation; never opens the machine
const HINT = {
  admit: "New work allowed? ×1.00 full, ×0.50 half, holding: start nothing new.",
  containers: "Watched containers. Applying: paused or capped when hot. Dry-run: logged only.",
  gpu: "GPU temperature, and the clock ceiling if one is set.",
  pair: "Tensor-parallel partner; both cap by the hotter box. ok: partner is fresh.",
  memory: "In use and free. DDR temperature shows only where the board exposes it.",
  gpus: "One cell per GPU; the hottest sets the level.",
  fan: "Fan speed. The kernel drives it, not the governor.",
  power: "Board power draw.",
  zones: "Thermal zones read; the hottest watched one sets the level.",
  sensors: "No readable Linux thermal sensors on this machine.",
  band: "Warm: new work slows. Critical: admission stops and batch jobs pause.",
  anon: "Anonymous memory (RssAnon), what the guard judges. File-backed pages are not counted.",
};
function Info({ k }) {
  return html`<span class="info" tabIndex="0" aria-label=${HINT[k]} onClick=${e => e.stopPropagation()} onKeyDown=${e => e.stopPropagation()}>
    <i class="i" aria-hidden="true">i</i><span class="tipx" role="tooltip">${HINT[k]}</span></span>`;
}

const unitText = (v, unit) => (v == null ? "" : fmt(v, 0) + unit);
function gpuText(b) {
  // the clock ceiling shows only when the root helper reports one ("ok (helper status: 1575)")

// latest non-null value of a series, or null
function lastValue(s) {

function Minis({ b, h }) {

  const x = ms => 2 + 116 * clamp((ms - h.t0) / (h.t1 - h.t0), 0, 1), y = v => 32 - 28 * (v - lo) / (hi - lo);

    ${h.gpus.map((s, k) => html`<div class="mini" key=${k}>GPU ${k} · <b>${fmt(now(k), 0)}°</b>
      <svg viewBox="0 0 120 36" preserveAspectRatio="none" role="img" aria-label=${"GPU " + k + ", now " + fmt(now(k), 0) + " °C"}>
        <line x1="2" x2="118" y1=${y(b.limits.warm_c)} y2=${y(b.limits.warm_c)} stroke="var(--line-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <path d=${pathOf(h.t.map(x), s.map(v => (v == null ? null : y(v))))} fill="none" stroke="var(--s2)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>

// ---- panel: one machine, or up to six compared ----
const MAXC = 6;
const slotColor = k => `var(--c${k + 1})`;
function summarize(b, h) {
  const v = h.temp.filter(x => x != null);
  const pk = h.temp.reduce((m, x, i) => x != null && (m < 0 || x > h.temp[m]) ? i : m, -1);
  const mean = v.reduce((a, c) => a + c, 0) / v.length;
  let share = null, held = null;
  const lv = h.level.filter(x => x != null);
  if (b.limits && lv.length) {
    const cnt = [0, 0, 0, 0]; lv.forEach(l => cnt[l]++);
    const cfs = h.cf.filter(x => x != null);
    share = cnt.map(c => c / lv.length); held = cfs.length ? cfs.filter(x => x < 1).length / cfs.length : 0;
  }
  return { pk, peak: h.temp[pk], mean, swing: Math.max(...v) - Math.min(...v), share, held };
}
const tableTimes = h => Array.from({ length: 12 }, (_, k) => h.t1 - k * (h.t1 - h.t0) / 11);
const shareTitle = (l, x) => l + " " + Math.round(x * 100) + "%";

function shareBar(share, label) {

  return html`<div class="seg2" role="img" aria-label=${label}>
        ${parts}

}

function singleStats(s, h, rk, governed) {

  return [peak, mean, [fmt(s.swing) + "°", "swing"], ["—", "no limit band"]];

function singleRow(h, rk, governed, ms, i) {

function CompareChart({ list, rk }) {

        <text class="end" x=${R + 18} y=${e.ly + 4}>${e.b.name} ${fmt(e.h.temp[e.li])}°</text></g>`)}

// the drawer takes focus on open, closes on Escape and hands focus back on close

// add a machine to the picks with the lowest free colour slot; it keeps that colour while picked
function addPick(sel, name) {
  const { picked: p, slots: s } = sel;
  if (p.includes(name) || p.length >= MAXC) return { picked: p, slots: s };
  const used = new Set(p.map(n => s[n]));

  while (used.has(k)) k++;

  return addPick(sel, name);
}

const mibText = v => (fin(v) ? gib(v) : "—");

  const far = farText(form, g, machine);
  const farEl = far ? html`<p class="callout"><${Icon} n="info" /><span>${far}</span></p>` : null;
  const del = isNew ? null : html`<button type="button" class="btn" onClick=${onDelete} disabled=${busy}><${Icon} n="bin" />Delete boundary</button>`;
  const saveLabel = isNew ? "Add boundary" : "Save boundary";
  const st = status || { state: "", text: "" };
  return html`<form class="card ed-form" aria-label="Boundary rule" noValidate onSubmit=${e => { e.preventDefault(); onSave(); }}>
    <${TextField} id="f-name" label="Name" value=${form.name} readOnly=${!isNew} hint=${nameHint} errs=${errs.name}
      onText=${v => upd(f => ({ ...f, name: v }))} />
    <${Matchers} form=${form} upd=${upd} errs=${errs} />
    <div class="ed-pair">
      <${Field} id="f-max" label="Boundary (MiB)" hint=${maxHint(form)} errs=${errs.max_mib}>
        <input id="f-max" class="input" type="number" min="64" step="1" inputMode="numeric" value=${form.max}
          ...${fieldAria("f-max", errs.max_mib, true)} onInput=${e => { const v = e.target.value; upd(f => ({ ...f, max: v })); }} />
      </${Field}>
      <${ScopeField} form=${form} upd=${upd} errs=${errs.scope} />
    </div>
    ${farEl}
    <${Errs} id="f-general-e" list=${errs.general} />
    <div class="ed-actions">
      <button type="button" class="btn" onClick=${onCancel}>Cancel</button>
      ${del}
      <button type="submit" class="btn primary" disabled=${busy}>${busy ? "Saving…" : saveLabel}</button>
    </div>
    <p class="ed-status" role="status" aria-live="polite" data-state=${st.state}>${st.text}</p>
  </form>`;
}
function ProcRow({ p }) {
  const s = ruleState(p);
  return html`<tr>
    <td>${p.pid}</td>
    <td>${p.user || "uid " + p.uid}</td>
    <td class="cmd"><code>${p.comm}</code><div class="note">${p.cmdline}</div></td>
    <td><code>${p.container || "—"}</code></td>
    <td>${mibText(p.rss_anon_mib)}</td>
    <td><span class=${"status " + ruleClass(s)}>${ruleWord(s)}</span><div class="note">${procNote(p)}</div></td>
  </tr>`;
}
function ProcTable({ procs }) {
  const rows = procs.map(p => html`<${ProcRow} key=${p.pid} p=${p} />`);
  return html`<div class="tablewrap"><table class="rules">
    <thead><tr><th scope="col">PID</th><th scope="col">User</th><th scope="col">Process</th><th scope="col">Container</th>
      <th scope="col" title=${HINT.anon}>Anonymous memory</th><th scope="col">Under this rule</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function KillConditions({ g }) {
  const items = killConditions(g).map(t => html`<li key=${t}>${t}</li>`);
  return html`<div class="callout warn"><${Icon} n="warn" /><div>The guard kills a process under this rule only when all of these hold:
    <ul>${items}</ul>${KILL_WHEN}</div></div>`;
}
function previewBody(pv, rule) {
  if (!pv) return html`<p class="srcnote">Change the rule to see which running processes it matches.</p>`;
  if (pv.kind === "invalid") return html`<p class="srcnote">Fix the messages beside the form to see what the rule matches.</p>`;
  if (pv.kind !== "ok") return html`<p class="srcnote">${"Preview unavailable: " + (pv.text || TOKEN_REFUSED)}</p>`;
  const d = pv.data, procs = Array.isArray(d.processes) ? d.processes : [];
  const table = procs.length ? html`<${ProcTable} procs=${procs} />` : null;
  const noGuard = d.guard_configured === false ? html`<p class="srcnote">This machine has no [memory] section: the guard's defaults are used.</p>` : null;
  return html`<${React.Fragment}><p class="srcnote">${previewLine(d, rule)} Guard action: ${d.action || "unknown"}.</p>${noGuard}${table}</${React.Fragment}>`;
}
function PreviewPanel({ machine, pv, scanning, rule, g }) {
  const live = scanning ? "Scanning " + machine + "…" : "Live scan on " + machine;
  return html`<section class="card ed-preview" aria-label="Preview" aria-busy=${scanning ? "true" : "false"}>
    <div class="drow"><h2>Matches now</h2><span class="eyebrow">${live}</span></div>
    ${previewBody(pv, rule)}
    <${KillConditions} g=${g} />
  </section>`;
}

// ---- modal dialogs: focus moves in on open and back on close, Tab stays inside, Escape closes ----
const FOCUSABLE = "button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex='-1'])";
const focusables = box => Array.from(box.querySelectorAll(FOCUSABLE));
// where Tab (or Shift+Tab) from position i of n moves focus to keep it inside; -1: leave it to the browser
function trapIndex(n, i, back) {
  if (!n) return -1;
  if (i < 0) return back ? n - 1 : 0;
  if (back && i === 0) return n - 1;
  if (!back && i === n - 1) return 0;
  return -1;
}
function modalKey(e, box, onClose) {
  if (!box) return;
  if (e.key === "Escape") {
    e.preventDefault();
    e.stopPropagation();
    onClose();
    return;
  }
  if (e.key !== "Tab") return;
  const els = focusables(box);
  const j = trapIndex(els.length, els.indexOf(document.activeElement), e.shiftKey);
  if (j >= 0) { e.preventDefault(); els[j].focus(); }
}
function useModalFocus(boxRef, onClose) {
  const cb = useRef(onClose);
  cb.current = onClose;
  useEffect(() => {
    const prev = document.activeElement;
    const box = boxRef.current;
    const first = box && (box.querySelector("[data-autofocus]") || focusables(box)[0]);
    if (first) first.focus();
    else if (box) box.focus();
    // capture on document, so the Machines drawer's Escape listener never sees this key
    const on = e => modalKey(e, boxRef.current, () => cb.current());
    document.addEventListener("keydown", on, true);
    return () => {
      document.removeEventListener("keydown", on, true);
      if (prev && prev.focus) prev.focus();
    };
  }, []);
}
function ModalFrame({ id, title, tone, icon, boxRef, children }) {
  return html`<div class="modal-scrim">
    <div class=${"modal " + (tone || "")} role="dialog" aria-modal="true" aria-labelledby=${id + "-t"} tabIndex="-1" ref=${boxRef}>
      <span class="mmark" aria-hidden="true"><${Icon} n=${icon} size=${20} /></span>
      <h2 id=${id + "-t"}>${title}</h2>
      ${children}
    </div>
  </div>`;
}
function Modal(props) {
  const ref = useRef(null);
  useModalFocus(ref, props.onClose);
  return html`<${ModalFrame} ...${props} boxRef=${ref} />`;
}
function DeleteBody({ name, machine, path, pv, onCancel, onConfirm }) {
  const n = pv && pv.kind === "ok" && fin(pv.data.matching) ? pv.data.matching : null;
  const now = n == null ? "" : " It matches " + n + (n === 1 ? " running process" : " running processes") + " now.";
  return html`<${React.Fragment}>
    <p>${"Without this boundary, the processes it matches are judged by growth alone, like any other process." + now}</p>
    <p class="callout">${"Removes " + name + " from " + (path || "boundaries.toml") + " on " + machine + ". The previous file is kept as a backup."}</p>
    <div class="row"><button type="button" class="btn" data-autofocus="true" onClick=${onCancel}>Keep it</button>
      <button type="button" class="btn danger" onClick=${onConfirm}><${Icon} n="bin" />Delete boundary</button></div>
  </${React.Fragment}>`;
}
function killBudget(g, machine) {
  if (!g || !fin(g.max_kills_per_hour)) return "";
  const used = fin(g.kills_last_hour) ? " (" + g.kills_last_hour + " used)" : "";
  return "A kill counts against the budget of " + g.max_kills_per_hour + " per hour on " + machine + used + ".";
}
function KillBody({ procs, g, machine, onCancel, onConfirm }) {
  const n = procs.length;
  const lead = n === 1 ? "One running process would be far over its boundary after this change, and the guard could kill it:" : n + " running processes would be far over their boundary after this change, and the guard could kill them:";
  const items = procs.map(p => html`<li key=${p.pid}><code>${"pid " + p.pid}</code><span class="cmd">${(p.user || "uid " + p.uid) + " · " + (p.cmdline || p.comm)}</span><b>${mibText(p.usage_mib)}</b></li>`);
  const budget = killBudget(g, machine);
  const budgetEl = budget ? html`<p>${budget}</p>` : null;
  return html`<${React.Fragment}>
    <p>${lead}</p>
    <ul class="plist" aria-label="Processes that could be killed">${items}</ul>
    <${KillConditions} g=${g} />
    ${budgetEl}
    <div class="row"><button type="button" class="btn" data-autofocus="true" onClick=${onCancel}>Back to the rule</button>
      <button type="button" class="btn danger" onClick=${onConfirm}>Save and allow the kill</button></div>
  </${React.Fragment}>`;
}
function ConflictBody({ machine, base, now, isNew, onCancel, onReload }) {
  const after = isNew ? "Reloading keeps your form and takes the file as it is now as the base." : "Reloading replaces the form with the rule as it is on the box now; your edits are discarded.";
  return html`<${React.Fragment}>
    <p>${"boundaries.toml on " + machine + " was saved after you opened this rule, so your change was not written."}</p>
    <p class="callout">${"You started from " + shortVer(base) + " · " + machine + " now has " + shortVer(now) + "."}</p>
    <p>${after}</p>
    <div class="row"><button type="button" class="btn" onClick=${onCancel}>Close</button>
      <button type="button" class="btn primary" data-autofocus="true" onClick=${onReload}><${Icon} n="refresh" />Reload the current rules</button></div>
  </${React.Fragment}>`;
}

// ---- editor views that are not the form ----
function RejectedView({ machine, error, row }) {
  const list = row && row.rules.length ? html`<${RulesTable} row=${row} />` : html`<p class="srcnote">The daemon reports no rules in use.</p>`;
  return html`<div class="card">
    <p class="callout warn" role="alert"><${Icon} n="warn" /><span>${"boundaries.toml on " + machine + " is rejected: " + error + ". Editing is disabled until the file is fixed on the box."}</span></p>
    <h2 class="sub2">Last good rules, still live</h2>
    <p class="srcnote">The daemon keeps running the rules it last loaded; these come from its state, not from the file.</p>
    ${list}
  </div>`;
}
function ReadOnlyRule({ machine, rule }) {
  const comm = Array.isArray(rule.comm) && rule.comm.length ? rule.comm.join(", ") : "—";
  return html`<div class="card">
    <p class="callout"><${Icon} n="lock" /><span>${"This rule lives in config.toml on " + machine + ". The page changes only boundaries.toml rules; change this one in config.toml on the box."}</span></p>
    <dl class="facts">
      <dt>Process names</dt><dd>${comm}</dd>
      <dt>Command line</dt><dd>${rule.cmdline || "—"}</dd>
      <dt>Cgroup</dt><dd>${rule.cgroup || "—"}</dd>
      <dt>Boundary</dt><dd>${mibText(rule.max_mib)}</dd>
      <dt>Counted</dt><dd>${scopeText(rule.scope)}</dd>
    </dl>
  </div>`;
}
function Notice({ text, children }) {
  return html`<div class="card"><p class="srcnote">${text}</p>${children}</div>`;
}

// ---- the editor ----
function useListing(machine, token, live, onUnauthorized) {
  const [st, setSt] = useState({ kind: "loading" });
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!live || !token) return undefined;
    let alive = true;
    setSt({ kind: "loading" });
    boundaryApi(machine, token).list().then(res => { if (alive) setSt(listState(res)); });
    return () => { alive = false; };
  }, [machine, token, live, n]);
  useEffect(() => { if (st.kind === "unauthorized") onUnauthorized(); }, [st]);
  return [st, () => setN(x => x + 1)];
}
const PREVIEW_DEBOUNCE_MS = 700;
function usePreview(machine, token, rule, on) {
  const [pv, setPv] = useState(null);
  const [scanning, setScanning] = useState(false);
  const key = JSON.stringify(rule);
  useEffect(() => {
    if (!on) return undefined;
    let alive = true;
    const timer = setTimeout(() => {
      setScanning(true);
      boundaryApi(machine, token).preview(rule).then(res => { if (alive) { setPv(previewState(res)); setScanning(false); } });
    }, PREVIEW_DEBOUNCE_MS);
    return () => { alive = false; clearTimeout(timer); setScanning(false); };
  }, [key, on, token]);
  return [pv, scanning];
}
function useSaver({ machine, token, version, writes, onSaved, go }) {
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState(null);
  const [modal, setModal] = useState(null);
  const [problems, setProblems] = useState(null);
  const settle = (out, req) => {
    if (out.kind === "saved") { onSaved(savedText(req.op, req.rule.name, machine, out)); go("boundaries"); return; }
    if (out.kind === "would_kill") setModal({ kind: "kill", req, procs: out.processes });
    if (out.kind === "conflict") setModal({ kind: "conflict", version: out.version });
    if (out.kind === "invalid") setProblems(out.problems);
    setStatus(finalStatus(out));
    if (out.kind === "unauthorized") writes.refuse("The token was refused, so nothing was saved. Enter it again.");
  };
  const attempt = async (op, rule, allowKill) => {
    const req = { op, rule, version, allowKill };
    setModal(null);
    setProblems(null);
    setBusy(true);
    setStatus({ state: "progress", text: progressText(op, machine) });
    const out = await runSave(boundaryApi(machine, token), req);
    setBusy(false);
    settle(out, req);
  };
  return { busy, status, modal, setModal, problems, setProblems, attempt };
}
function editorModal(s, ctx) {
  const m = s.modal;
  if (!m) return null;
  const close = () => s.setModal(null);
  if (m.kind === "delete") {
    return html`<${Modal} id="dlg-del" tone="danger" icon="bin" title=${"Delete " + ctx.name + " on " + ctx.machine + "?"} onClose=${close}>
      <${DeleteBody} name=${ctx.name} machine=${ctx.machine} path=${ctx.path} pv=${ctx.pv} onCancel=${close} onConfirm=${() => s.attempt("rm", { name: ctx.name }, false)} /></${Modal}>`;
  }
  if (m.kind === "kill") {
    const title = m.procs.length === 1 ? "This change would kill a running process" : "This change would kill running processes";
    return html`<${Modal} id="dlg-kill" tone="danger" icon="warn" title=${title} onClose=${close}>
      <${KillBody} procs=${m.procs} g=${ctx.g} machine=${ctx.machine} onCancel=${close} onConfirm=${() => s.attempt(m.req.op, m.req.rule, true)} /></${Modal}>`;
  }
  const reload = () => { close(); ctx.onReload(); };
  return html`<${Modal} id="dlg-conflict" tone="warn" icon="refresh" title=${ctx.machine + "'s boundaries changed while you were editing"} onClose=${close}>
    <${ConflictBody} machine=${ctx.machine} base=${ctx.version} now=${m.version} isNew=${ctx.isNew} onCancel=${close} onReload=${reload} /></${Modal}>`;
}
function RuleEditor({ machine, data, view, form, upd, touched, isNew, g, writes, go, onSaved, onReload }) {
  const rule = ruleFromForm(form);
  const [pv, scanning] = usePreview(machine, writes.token, rule, touched || !isNew);
  const s = useSaver({ machine, token: writes.token, version: data.version, writes, onSaved, go });
  useEffect(() => { if (pv && pv.kind === "unauthorized") writes.refuse(); }, [pv]);
  const errs = problemsByField(s.problems || (pv && pv.kind === "invalid" ? pv.problems : []));
  const edit = fn => { s.setProblems(null); upd(fn); };
  const name = view.rule ? view.rule.name : rule.name;
  const ctx = { machine, name, path: data.boundaries_path, pv, g, version: data.version, isNew, onReload };
  return html`<${React.Fragment}>
    <div class="ed-grid">
      <${RuleForm} form=${form} upd=${edit} isNew=${isNew} errs=${errs} g=${g} machine=${machine} busy=${s.busy} status=${s.status}
        onSave=${() => s.attempt(isNew ? "add" : "set", rule, false)} onDelete=${() => s.setModal({ kind: "delete" })} onCancel=${() => go("boundaries")} />
      <${PreviewPanel} machine=${machine} pv=${pv} scanning=${scanning} rule=${rule} g=${g} />
    </div>
    <p class="srcnote">${"Saves to " + (data.boundaries_path || "boundaries.toml") + " on " + machine + ", based on version " + shortVer(data.version) + ". Validated on the box and written with a backup; the daemon reloads it within about 2 s."}</p>
    ${editorModal(s, ctx)}
  </${React.Fragment}>`;
}
// what fills the editor below its heading, from the gate, the token and the file read on the box
function editorMain(p) {
  const { mode, gate, listing, view, machine } = p;
  if (mode !== "unlocked") return html`<${WritesPanel} writes=${p.writes} mode=${mode} id="tok-edit" />`;
  if (gate) return html`<${Notice} text=${"This machine's boundaries cannot be changed from here: " + gate + "."} />`;
  if (listing.kind === "loading") return html`<${Notice} text=${"Reading boundaries.toml on " + machine + "…"} />`;
  if (listing.kind !== "ok") {
    const retry = html`<button type="button" class="btn sm" onClick=${p.reload}><${Icon} n="refresh" />Try again</button>`;
    return html`<${Notice} text=${"Cannot read the boundaries on " + machine + ": " + (listing.text || TOKEN_REFUSED)}>${retry}</${Notice}>`;
  }
  if (view.mode === "rejected") return html`<${RejectedView} machine=${machine} error=${listing.data.error} row=${p.row} />`;
  if (view.mode === "missing") return html`<${Notice} text=${"No rule named " + p.ruleName + " in boundaries.toml on " + machine + ". It may have been deleted."} />`;
  if (view.mode === "readonly") return html`<${ReadOnlyRule} machine=${machine} rule=${view.rule} />`;
  return html`<${RuleEditor} ...${p.editor} data=${listing.data} view=${view} />`;
}
// the fleet machine an editor route names, and why it cannot be changed ("" when it can)
function routeMachine(doc, machine) {
  const m = ((doc && doc.machines) || []).find(x => x && x.name === machine) || null;
  if (!doc) return { m, g: null, row: null, gate: "waiting for the fleet reader" };
  const g = m ? guardOf(m.thermal) : null;
  return { m, g, row: g ? toGuardRow(m) : null, gate: machineGate(m ? toBox(m) : null) };
}
function Editor({ route, doc, writes, go, onSaved }) {
  const { machine, rule: ruleName, isNew } = route;
  const { g, row, gate } = routeMachine(doc, machine);
  const mode = writesMode(writes.enabled, writes.token, writes.probeErr);
  const [listing, reload] = useListing(machine, writes.token, mode === "unlocked" && !gate, writes.refuse);
  const view = listing.kind === "ok" ? editState(listing.data, ruleName, isNew) : null;
  // null: the form shows the rule as read on the box; set on the first edit
  const [form, setForm] = useState(null);
  const base = () => formFromRule(view && view.rule);
  const upd = fn => setForm(f => fn(f || base()));
  const onReload = () => { if (!isNew) setForm(null); reload(); };
  const head = useRef(null);
  useEffect(() => { if (head.current) head.current.focus(); }, []);
  const editor = { machine, form: form || base(), upd, touched: form !== null, isNew, g, writes, go, onSaved, onReload };
  const main = editorMain({ mode, gate, listing, view, machine, ruleName, writes, reload, editor, row });
  return html`<section aria-labelledby="ed-title">
    <a class="back" href="#boundaries"><span aria-hidden="true">←</span> Boundaries</a>
    <div class="titlebar"><div><span class="eyebrow">${editorEyebrow(machine, view, isNew)}</span>
      <h1 id="ed-title" tabIndex="-1" ref=${head}>${isNew ? "New boundary" : ruleName}</h1></div></div>
    ${main}
  </section>`;
}

function App() {
  const [pref, setPrefS] = useState(() => { const v = store.get("hg-mode", "system"); return ["system", "light", "dark"].includes(v) ? v : "system"; });
  const mode = useMode(pref);
  const { doc, err } = useFleet();
  const setPref = k => { setPrefS(k); store.set("hg-mode", k); };
  useEffect(() => { document.documentElement.dataset.mode = mode; }, [mode]);
  const [route, setRoute] = useState(() => readRoute(location.hash));
  useEffect(() => { const on = () => setRoute(readRoute(location.hash)); addEventListener("hashchange", on); return () => removeEventListener("hashchange", on); }, []);
  // setting the hash adds a history entry (Back returns to the previous view) and fires hashchange
  const go = t => { setRoute(readRoute("#" + t)); if (location.hash !== "#" + t) location.hash = t; };
  const tab = route.tab;
  const writes = useWrites();
  const [flash, setFlash] = useState("");
  useEffect(() => { if (!flash) return undefined; const t = setTimeout(() => setFlash(""), 15000); return () => clearTimeout(t); }, [flash]);
  const editKey = route.machine + "/" + (route.isNew ? NEW_RULE : route.rule);
  const editor = route.machine ? html`<${Editor} key=${editKey} route=${route} doc=${doc} writes=${writes} go=${go} onSaved=${setFlash} />` : null;
  const rules = useMemo(() => fleetRuleTotal(doc), [doc]);
  const ruleCount = doc && html`<span class="n">${rules}</span>`;
  const tabs = TABS.map(([k, l]) => html`<button key=${k} aria-current=${tab === k ? "page" : undefined} onClick=${() => go(k)}>${l}${k === "boundaries" && ruleCount}</button>`);
  return html`<${React.Fragment}>
    <header class="app-header">
      <div style=${{ display: "flex", alignItems: "center", gap: "12px 18px", flexWrap: "wrap", minWidth: 0 }}>
        <div class="brand"><span class="mark rune" aria-hidden="true">ᚲ</span>heat-governor</div>
        <nav class="pills" aria-label="Sections">${tabs}</nav>
      </div>
      <div class="pills sm" role="group" aria-label="Appearance">
        ${[["system", "Auto"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => html`<button key=${k} aria-pressed=${pref === k} onClick=${() => setPref(k)}>${l}</button>`)}
      </div>
    </header>
    <main>
      <div hidden=${tab !== "machines"}><${Machines} doc=${doc} err=${err} /></div>
      <div hidden=${tab !== "boundaries"}>
        <div hidden=${!!route.machine}><${Boundaries} doc=${doc} err=${err} writes=${writes} go=${go} flash=${flash} /></div>
        ${editor}
      </div>
    </main>
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
