<!-- Locked design reference for the heat-governor fleet dashboard (heat-governor mesh serve).
     Source: https://claude.ai/artifact/JMe4tUb7V64zQhii6bmsS4, version 1794166791-7eb1, locked 2026-11-08.
     Readings are a 2026-11-08 snapshot plus invented example fleets and generated history; not live data. -->
<title>Heat Governor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap">
<style>
/* Layout: title, theme row, the fleet diagram on top, then a filter bar and one row (or tile) per machine.
   Four skins x two modes. data-skin picks the palette, data-mode (light|dark) is resolved in script from
   the host's data-theme or prefers-color-scheme, or forced by the in-page toggle. Lato throughout. */
:root { color-scheme: light;
  --s1:#e06a2a; --s2:#5a6bb5;
  --bg:#f5f0e6; --surface:#fbf8f1; --surface-2:#f7f2e9; --raise:#ece5d7;
  --ink:#38362f; --ink-soft:#6c675d; --ink-faint:#9f998c;
  --line:rgba(56,54,47,.08); --line-strong:rgba(56,54,47,.14);
  --cool:#3a8fb8; --warm:#c27a24; --hot:#d23f25; --accent:#e06a2a; --accent-tint:rgba(224,106,42,.08);
  --heat:linear-gradient(90deg,#a9d6ec,#5b8fb0 30%,#8b6f80 52%,#d8643f 72%,#e06a2a 86%,#f0a050);
  --dim:rgba(251,248,241,.86); --header:rgba(245,240,230,.86); --glow:none;
  --radius:16px; --ease:cubic-bezier(.22,1,.36,1);
  --font-body:"Lato",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace }
html[data-skin="polar"][data-mode="dark"] { color-scheme:dark;
  --s1:#e06a2a; --s2:#7282e0;
  --bg:#0e1117; --surface:#151922; --surface-2:#1b202b; --raise:#252b39;
  --ink:#e9ebf0; --ink-soft:#9ba2b0; --ink-faint:#646b79;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --cool:#8ecbe8; --warm:#f2a65a; --hot:#ff5a3c; --accent:#ff8a3d; --accent-tint:rgba(255,138,61,.10);
  --heat:linear-gradient(90deg,#8ecbe8,#5b8fb0 30%,#7a5a6e 52%,#d8643f 72%,#ff8a3d 86%,#ffc27a);
  --dim:rgba(21,25,34,.86); --header:rgba(14,17,23,.82);
  --glow:radial-gradient(70% 100% at 50% 100%, rgba(255,138,61,.07), transparent 70%) }
html[data-skin="geo"] { color-scheme:light;
  --s1:#d4592a; --s2:#4f5fb0;
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --raise:#e2e7ea;
  --ink:#1d272d; --ink-soft:#526068; --ink-faint:#8b979e;
  --line:rgba(29,39,45,.08); --line-strong:rgba(29,39,45,.15);
  --cool:#2f86ab; --warm:#c47a1f; --hot:#c23b22; --accent:#d4592a; --accent-tint:rgba(212,89,42,.08);
  --heat:linear-gradient(90deg,#bfe3ef,#6fb3cf 24%,#8d9ba2 48%,#e0a35a 70%,#d4592a 86%,#a8321c);
  --dim:rgba(255,255,255,.84); --header:rgba(238,241,243,.85); --glow:none }
html[data-skin="geo"][data-mode="dark"] { color-scheme:dark;
  --s1:#e46a30; --s2:#6f80dc;
  --bg:#121618; --surface:#1a1f22; --surface-2:#20262a; --raise:#2b3236;
  --ink:#e6ecee; --ink-soft:#9aa6ac; --ink-faint:#66737a;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --cool:#7cc3de; --warm:#e3a24f; --hot:#ff6a45; --accent:#ff7a3d; --accent-tint:rgba(255,122,61,.10);
  --heat:linear-gradient(90deg,#bfe3ef,#6fb3cf 24%,#5d6b72 48%,#e0a35a 70%,#ff7a3d 86%,#ffb37a);
  --dim:rgba(26,31,34,.86); --header:rgba(18,22,24,.82);
  --glow:radial-gradient(70% 100% at 50% 100%, rgba(255,122,61,.06), transparent 70%) }
html[data-skin="kiln"] { color-scheme:light;
  --s1:#b4552e; --s2:#5f5aa8;
  --bg:#f4eee5; --surface:#fffaf3; --surface-2:#f9f2e8; --raise:#ebe0d1;
  --ink:#2e2520; --ink-soft:#6a5c51; --ink-faint:#a29486;
  --line:rgba(46,37,32,.08); --line-strong:rgba(46,37,32,.15);
  --cool:#5f8a83; --warm:#b97a2e; --hot:#9e3324; --accent:#b4552e; --accent-tint:rgba(180,85,46,.08);
  --heat:linear-gradient(90deg,#a9c6bf,#d9cdb9 30%,#e6bb80 55%,#cf8047 74%,#b4552e 88%,#8a2c20);
  --dim:rgba(255,250,243,.84); --header:rgba(244,238,229,.86); --glow:none }
html[data-skin="kiln"][data-mode="dark"] { color-scheme:dark;
  --s1:#d06a36; --s2:#8a7fd6;
  --bg:#18130f; --surface:#211a15; --surface-2:#2a211b; --raise:#362b23;
  --ink:#f1e7da; --ink-soft:#b3a393; --ink-faint:#7c6d60;
  --line:rgba(255,240,225,.07); --line-strong:rgba(255,240,225,.13);
  --cool:#8fbab2; --warm:#e0a35a; --hot:#e9604a; --accent:#d9733f; --accent-tint:rgba(217,115,63,.11);
  --heat:linear-gradient(90deg,#a9c6bf,#8a8073 30%,#e6bb80 55%,#cf8047 74%,#d9733f 88%,#f0a36a);
  --dim:rgba(33,26,21,.86); --header:rgba(24,19,15,.84);
  --glow:radial-gradient(70% 100% at 50% 100%, rgba(217,115,63,.07), transparent 70%) }
html[data-skin="aurora"] { color-scheme:light;
  --s1:#6d5ce6; --s2:#0e7fb0;
  --bg:#f2f4fa; --surface:#ffffff; --surface-2:#f6f7fc; --raise:#e5e8f4;
  --ink:#1a1f33; --ink-soft:#565d78; --ink-faint:#8e94ab;
  --line:rgba(26,31,51,.08); --line-strong:rgba(26,31,51,.15);
  --cool:#12a37a; --warm:#c27a24; --hot:#d63b4c; --accent:#6d5ce6; --accent-tint:rgba(109,92,230,.08);
  --heat:linear-gradient(90deg,#34c79a,#2fa9bf 24%,#6d5ce6 48%,#a94fc0 66%,#e8732a 86%,#f0a050);
  --dim:rgba(255,255,255,.85); --header:rgba(242,244,250,.85); --glow:none }
html[data-skin="aurora"][data-mode="dark"] { color-scheme:dark;
  --s1:#8b6cf0; --s2:#1f9dcc;
  --bg:#0a0e19; --surface:#111727; --surface-2:#161e33; --raise:#202b45;
  --ink:#e8ecf5; --ink-soft:#97a2bc; --ink-faint:#5d6884;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --cool:#6ee7b7; --warm:#f2a65a; --hot:#ff5f6d; --accent:#8b7cf6; --accent-tint:rgba(139,124,246,.12);
  --heat:linear-gradient(90deg,#6ee7b7,#5ec8d8 24%,#8b7cf6 48%,#c26bd6 66%,#ff8a3d 86%,#ffb86b);
  --dim:rgba(17,23,39,.86); --header:rgba(10,14,25,.82);
  --glow:radial-gradient(90% 50% at 50% 0%, rgba(110,231,183,.06), transparent 70%), radial-gradient(60% 40% at 80% 0%, rgba(139,124,246,.07), transparent 70%) }

* { box-sizing:border-box }
html { background:var(--bg); transition:background .4s var(--ease) }
body { margin:0; min-height:100%; color:var(--ink); background:var(--bg); font-family:var(--font-body); font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .4s var(--ease), color .4s var(--ease) }
body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; background:var(--glow) }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:6px }
code, .mono { font-family:var(--font-mono); font-size:.84em }
code { color:var(--ink-soft); overflow-wrap:anywhere }
.rune { font-family:"Segoe UI Historic","Noto Sans Runic","Junicode",serif; font-weight:400 }
button { font:inherit }

.app-header { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px 16px; flex-wrap:wrap;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--header); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line) }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg) }
@media (min-width:720px){ .app-header{ padding-left:max(40px,env(safe-area-inset-left,0px)); padding-right:max(40px,env(safe-area-inset-right,0px)) } }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; color:var(--ink-soft) }
.brand .mark { color:var(--accent); font-size:17px; width:18px; text-align:center }
.pills { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--surface); border:1px solid var(--line); overflow-x:auto; max-width:100% }
.pills button { appearance:none; border:0; background:transparent; color:var(--ink-soft); font-size:14px; padding:6px 15px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:color .25s var(--ease), background .25s var(--ease) }
.pills button:hover { color:var(--ink) }
.pills button[aria-pressed="true"], .pills button[aria-current="page"] { background:var(--raise); color:var(--ink); font-weight:700 }
.pills.sm button { font-size:13px; padding:5px 12px }
.pills .n { font-variant-numeric:tabular-nums; color:var(--ink-faint); margin-left:5px; font-weight:400 }

main { padding-block:32px 80px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); max-width:74rem; margin:0 auto }
@media (min-width:720px){ main{ padding-left:max(40px,env(safe-area-inset-left,0px)); padding-right:max(40px,env(safe-area-inset-right,0px)) } }
.titlebar { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px }
h1 { font-weight:900; font-size:clamp(2rem,4.6vw,2.8rem); line-height:1.05; letter-spacing:-.02em; margin:.25rem 0 0 }
h2 { font-weight:700; font-size:1.1rem; margin:2.6rem 0 1rem }
.lede { font-size:1.05rem; color:var(--ink-soft); max-width:44rem; margin:-.4rem 0 1.6rem; font-weight:300 }
.eyebrow { font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint) }

/* theme row */
.skins { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:0 0 18px }
@media (max-width:760px){ .skins{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.skin { appearance:none; text-align:left; cursor:pointer; padding:12px 14px 10px; border-radius:14px; border:1px solid var(--line);
  background:var(--sk-bg); color:var(--sk-ink); display:grid; gap:7px; transition:transform .25s var(--ease), border-color .25s, box-shadow .25s }
.skin:hover { transform:translateY(-2px) }
.skin[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint) }
.skin .nm { font-weight:700; font-size:.9rem }
.skin .ramp { height:5px; border-radius:999px; background:var(--sk-heat) }
.skin .ends { display:flex; justify-content:space-between; font-size:.66rem; opacity:.65 }

.card { min-width:0; padding:1.4rem 1.6rem; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); transition:background .4s var(--ease) }
.flow { overflow-x:auto }
.flow svg { display:block; min-width:640px; width:100% }

/* summary + filters */
.summary { display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 12px }
.chip { --m:var(--ink-faint); appearance:none; display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:12px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); font-size:.86rem; transition:border-color .2s, background .2s }
.chip b { font-size:1.15rem; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums }
.chip::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--m) }
.chip.cool { --m:var(--cool) } .chip.warm { --m:var(--warm) } .chip.hot { --m:var(--hot) } .chip.critical { --m:var(--hot) }
.chip.critical::before { box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 25%,transparent) }
.chip.unreachable::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.chip[aria-pressed="true"] { border-color:var(--m); background:color-mix(in srgb,var(--m) 9%,var(--surface)) }
.chip:disabled { opacity:.45; cursor:default }
.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px }
.search { flex:1 1 12rem; min-width:0; max-width:18rem; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px }
.search::placeholder { color:var(--ink-faint) }
.count { font-size:.82rem; color:var(--ink-faint); margin-left:auto }
.clear { appearance:none; border:0; background:none; color:var(--accent); cursor:pointer; font-size:.82rem; padding:4px 6px }

/* machine rows */
.lanes { display:grid; gap:10px }
.lane { --m:var(--ink-faint);
  display:grid; grid-template-columns:210px minmax(0,1fr) 230px; gap:26px; align-items:center;
  padding:18px 24px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line);
  transition:border-color .3s var(--ease), background .4s var(--ease) }
.lane:hover { border-color:var(--line-strong); background:var(--surface-2) }
.cool { --m:var(--cool) } .warm { --m:var(--warm) } .hot, .critical { --m:var(--hot) }
.lane.critical { border-color:color-mix(in srgb,var(--hot) 45%,transparent) }
.lane.unreachable { border-style:dashed; background:transparent }
.lane.unreachable .temp, .lane.unreachable .scale { opacity:.45 }
@media (max-width:900px){ .lane{ grid-template-columns:1fr; gap:14px; padding:18px } }
.who { display:grid; gap:1px; min-width:0 }
.who .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.who .mark { font-size:17px; color:var(--m); width:22px; text-align:center }
.who .name { font-weight:700; font-size:1.12rem }
.who .sub { font-size:.78rem; color:var(--ink-soft); padding-left:32px }
.who .sub.faint { color:var(--ink-faint) }
.tag { font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); border:1px solid var(--line-strong); border-radius:999px; padding:1px 7px }
.status { display:inline-flex; align-items:center; gap:7px; font-size:.8rem; color:var(--m); font-weight:700 }
.status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--m); box-shadow:0 0 0 4px color-mix(in srgb,var(--m) 16%,transparent) }
.unreachable .status::before { background:transparent; border:1.5px dashed var(--ink-faint); box-shadow:none }
.meter { min-width:0 }
.readout { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap }
.temp { font-variant-numeric:tabular-nums; font-weight:300; font-size:2.1rem; line-height:1; letter-spacing:-.02em }
.temp small { font-size:.85rem; color:var(--ink-faint); margin-left:3px }
.why { font-size:.8rem; color:var(--ink-faint) }
.scale { position:relative; height:6px; border-radius:999px; background:var(--heat); margin:13px 0 6px }
.scale .dim { position:absolute; top:0; bottom:0; right:0; background:var(--dim); border-radius:0 999px 999px 0 }
.scale .head { position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--surface); border:3px solid var(--m) }
.scale .band { position:absolute; top:-4px; bottom:-4px; border-inline:1px solid var(--ink-faint); background:color-mix(in srgb,var(--ink) 7%,transparent); border-radius:3px }
.scale.off { background:none; border:1px dashed var(--line-strong); height:6px }
.lane.unsupported, .tile.unsupported { border-style:dashed; background:transparent }
.unsupported .status::before { background:transparent; border:1.5px dashed var(--ink-faint); box-shadow:none }
.chip.unsupported::before { background:transparent; border:1.5px dashed var(--ink-faint) }
.gpus { display:inline-flex; gap:3px; vertical-align:middle }
.gpus i { width:12px; height:12px; border-radius:3px }
.tile .gpus i { width:100%; height:8px } .tile .gpus { display:grid; grid-template-columns:repeat(8,1fr) }
.ticks { position:relative; height:16px; font-size:.68rem; color:var(--ink-faint); font-variant-numeric:tabular-nums }
.ticks span { position:absolute; white-space:nowrap }
.facts { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; min-width:0; font-size:.82rem }
.facts dt { color:var(--ink-faint) } .facts dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; color:var(--ink-soft) }

/* machine tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr)); gap:10px }
.tile { --m:var(--ink-faint); padding:16px 16px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); display:grid; gap:6px; min-width:0 }
.tile.critical { border-color:color-mix(in srgb,var(--hot) 45%,transparent) }
.tile.unreachable { border-style:dashed; background:transparent }
.tile .row { display:flex; justify-content:space-between; align-items:center; gap:8px }
.tile .nm { font-weight:700; display:flex; gap:8px; align-items:center; min-width:0 }
.tile .nm .mark { color:var(--m) }
.tile .temp { font-size:1.7rem }
.tile .scale { margin:6px 0 2px; height:4px }
.tile .scale .head { width:10px; height:10px; margin:-5px 0 0 -5px; border-width:2px }
.tile .meta { font-size:.72rem; color:var(--ink-faint); overflow-wrap:anywhere }
.empty { padding:40px; text-align:center; color:var(--ink-faint); border:1px dashed var(--line-strong); border-radius:var(--radius) }

/* survey + decisions */
.surfaces { display:grid; gap:10px }
.surface { display:grid; grid-template-columns:44px minmax(0,1fr); gap:14px; padding:18px 20px; border-radius:14px; background:var(--surface); border:1px solid var(--line) }
.sid { font-size:.8rem; color:var(--ink-faint); padding-top:2px }
.surface h3 { margin:0 0 4px; font-size:.98rem; font-weight:700; overflow-wrap:anywhere }
.surface p { margin:0; font-size:.9rem; color:var(--ink-soft) }
.claim { margin-top:12px; padding:12px 14px; border-radius:10px; background:var(--surface-2); font-size:.88rem; color:var(--ink-soft) }
.claim .k { display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--k); margin-right:8px }
.k-requirement { --k:var(--accent) } .k-boundary { --k:var(--cool) } .k-non_goal { --k:var(--ink-faint) }
.qs { display:grid; gap:14px }
.q { display:grid; gap:12px }
.q .qid { font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint) }
.q h3 { margin:0; font-size:1.05rem; line-height:1.5; font-weight:700 }
.opts { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr)); gap:10px }
.opt { border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:.88rem; color:var(--ink-soft) }
.opt b { display:block; margin-bottom:3px; color:var(--ink) }
.opt.rec { border-color:color-mix(in srgb,var(--accent) 45%,transparent); background:var(--accent-tint) }
.opt .tg { font-size:.66rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent) }
.resolved { font-size:.88rem; padding:12px 16px; border-radius:12px; background:var(--surface-2); color:var(--ink-soft) }
.resolved b { color:var(--cool) }
.park { padding:14px 18px; border-radius:12px; border:1px dashed var(--line-strong); font-size:.9rem; color:var(--ink-soft) }
.alert { padding:16px 20px; border-radius:14px; background:color-mix(in srgb,var(--hot) 9%,transparent); border:1px solid color-mix(in srgb,var(--hot) 28%,transparent); font-size:.92rem; color:var(--ink-soft); margin-bottom:20px }
.alert b { color:var(--ink) }

/* info hints */
.info { position:relative; display:inline-flex; vertical-align:1px; margin-left:5px; cursor:help; border-radius:50% }
.info .i { display:inline-grid; place-items:center; width:14px; height:14px; border-radius:50%; border:1px solid var(--line-strong); color:var(--ink-faint); font-size:9px; font-weight:700; font-style:normal; line-height:1 }
.info:hover .i, .info:focus-visible .i { color:var(--ink); border-color:var(--ink-faint) }
.info .tipx { position:absolute; left:-6px; bottom:calc(100% + 8px); width:min(250px,70vw); padding:9px 11px; border-radius:10px; z-index:30;
  background:var(--surface-2); border:1px solid var(--line-strong); box-shadow:0 8px 24px rgba(0,0,0,.18); color:var(--ink-soft); font-size:.76rem; font-weight:400; line-height:1.45; text-transform:none; letter-spacing:0;
  opacity:0; visibility:hidden; transform:translateY(3px); transition:opacity .18s var(--ease), transform .18s var(--ease), visibility .18s }
.info:hover .tipx, .info:focus .tipx { opacity:1; visibility:visible; transform:none }

/* selectable machines */
.lane, .tile { cursor:pointer }
.lane:focus-visible, .tile:focus-visible { outline:2px solid var(--accent); outline-offset:2px }

function useMode(pref) {
  const sys = () => { const t = document.documentElement.getAttribute("data-theme"); if (t === "dark" || t === "light") return t;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; };
  const [sysMode, setSys] = useState(sys);
  useEffect(() => {
    const mq = matchMedia("(prefers-color-scheme: dark)"); const on = () => setSys(sys());
    mq.addEventListener("change", on);
    const mo = new MutationObserver(on); mo.observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
    return () => { mq.removeEventListener("change", on); mo.disconnect(); };
  }, []);
  return pref === "system" ? sysMode : pref;
}

function Scale({ temp, limits, ends, lo = 30, hi, small }) {
  hi = hi || Math.max(110, (limits && limits.crit_c + 6) || 110);
  const pct = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  // one band from warm to crit with a single label, so close limits never collide
  const a = limits ? pct(limits.warm_c) : null, z = limits ? pct(limits.crit_c) : null;
  const mid = limits ? (a + z) / 2 : 0;
  const anchor = mid > 85 ? { right: (100 - z) + "%" } : mid < 15 ? { left: a + "%" } : { left: mid + "%", transform: "translateX(-50%)" };
  if (temp == null) return html`<div><div class="scale off" role="img" aria-label="no reading"></div>${!small && html`<div class="ticks"><span style=${{ left: 0 }}>no reading</span></div>`}</div>`;
  return html`<div>
    <div class="scale" role="img" aria-label=${`${fmt(temp)} °C${limits ? `, governs between ${limits.warm_c} and ${limits.crit_c} °C` : ""}`}>
      <div class="dim" style=${{ left: pct(temp) + "%" }}></div>
      ${limits && html`<div class="band" style=${{ left: a + "%", width: (z - a) + "%" }}></div>`}
      <div class="head" style=${{ left: pct(temp) + "%" }}></div>
    </div>
    ${!small && limits && html`<div class="ticks"><span style=${anchor}>${limits.warm_c}–${limits.crit_c}°</span></div>`}
  </div>`;
}

// Fleet map: one node per platform group around the cultureos hub; each node is coloured by its
// worst member and names the states that need attention.
function Flow({ fleet }) {
  const colour = s => ({ cool:"var(--cool)", warm:"var(--warm)", hot:"var(--hot)", critical:"var(--hot)" })[s] || "var(--ink-faint)";
  const keys = [...new Set(fleet.map(b => b.pkey))].filter(p => p !== "ventunoq");
  const groups = keys.map(p => {
    const ms = fleet.filter(b => b.pkey === p);
    const worst = ms.reduce((w, b) => SEVERITY[b.state] > SEVERITY[w] ? b.state : w, "cool");
    const c = ms.reduce((o, b) => (o[b.state] = (o[b.state] || 0) + 1, o), {});
    const issues = ["critical", "hot", "warm", "unreachable", "unsupported"].filter(s => c[s]).map(s => ms.length === 1 ? (s === "unsupported" ? "not supported" : s) : `${c[s]} ${s}`);
    const pairs = Math.floor(ms.filter(b => b.pair).length / 2);
    const gpus = ms.reduce((n, b) => n + (b.gpus ? b.gpus.length : 0), 0);
    // at most two items per line, so the summary always fits inside its box
    const sub = issues.length ? Array.from({ length: Math.ceil(issues.length / 2) }, (_, k) => issues.slice(k * 2, k * 2 + 2).join(" · "))
      : [[pairs ? `${pairs} pair${pairs > 1 ? "s" : ""}` : "", gpus ? `${gpus} GPUs` : "", "all cool"].filter(Boolean).join(" · ")];
    return { p, n: ms.length, worst, sub };
  });
  const hub = fleet.find(b => b.pkey === "ventunoq");
  // groups alternate left and right of the hub; the map grows taller as groups are added
  const lines = Math.max(1, ...groups.map(g => g.sub.length));
  const rows = Math.max(2, Math.ceil(groups.length / 2)), gw = 220, gh = 48 + lines * 16, rowGap = 22;
  const W = 900, H = rows * gh + (rows - 1) * rowGap + 40, hx = W / 2, hy = H / 2;
  const spots = groups.map((g, i) => [i % 2 ? W - 30 - gw : 30, 20 + Math.floor(i / 2) * (gh + rowGap)]);

// ---- machine trends ----
// No daemon serves history yet, so each machine's history is generated from a seed of its name,
// shaped to end exactly at its current reading and state. Labelled as an example in the panel.
const RANGES = { "15m": { dt: 3, label: "15 min" }, "1h": { dt: 12, label: "1 hour" }, "6h": { dt: 72, label: "6 hours" }, "24h": { dt: 288, label: "24 hours" } };
const NPTS = 300;
const T_END = Date.parse("2026-11-08T18:28:33Z");

const CF = [1, .5, .25, 0];
function rng(seed) { let s = 2166136261; for (const c of seed) s = Math.imul(s ^ c.charCodeAt(0), 16777619) >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

  const bursts = Array.from({ length: 2 + Math.floor(r() * 3) }, () => ({ c: r() * N, w: 4 + r() * 22, a: amp * (.5 + r() * .8) }));
  if (["warm", "hot", "critical"].includes(b.state)) bursts.push({ c: N - 1 - r() * 6, w: 6 + r() * 8, a: amp });
  const base0 = b.temp - amp * .9, sd = Math.min(1.6, .35 + dt / 80);

  for (let i = 0; i < N; i++) {
    ou = ou * .85 + (r() - .5) * 2 * sd;
    let w = 0; for (const k of bursts) w += k.a * Math.exp(-((i - k.c) ** 2) / (2 * k.w * k.w));
    raw.push(base0 + w + ou);
  }
  const shift = b.temp - raw[N - 1];
  const temp = raw.map((v, i) => +(v + shift * i / (N - 1)).toFixed(1)); temp[N - 1] = b.temp;
  const gpus = b.gpus ? b.gpus.map((g, k) => temp.map(v => +(g - (b.temp - v) * (.7 + .1 * (k % 3)) + (r() - .5) * 1.4).toFixed(1))) : null;
  if (gpus) gpus.forEach((s, k) => { s[N - 1] = b.gpus[k]; });
  const gOff = !b.gpus && b.gpu_temp != null ? b.temp - b.gpu_temp : null;
  const gpu = gOff == null ? null : temp.map((v, i) => +(v - gOff + (r() - .5) * 1.2 - (i ? (v - temp[i - 1]) * .6 : 0)).toFixed(1));

    const th = [L.warm_c, L.hot_c, L.crit_c]; let up = 0; th.forEach((x, j) => { if (v >= x) up = j + 1; });
    if (up > lv) lv = up; else while (lv > 0 && v < th[lv - 1] - 1) lv--;
    level.push(lv); cf.push(CF[lv]);

    const gap = Math.max(1, Math.ceil((b.age || 40) / dt));
    for (let i = N - gap; i < N; i++) { temp[i] = null; level[i] = null; cf[i] = null; if (gpu) gpu[i] = null; if (gpus) gpus.forEach(s => { s[i] = null; }); }

const hhmm = ms => { const d = new Date(ms); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); };

    <div class="legend2">
      ${list.map(o => html`<span key=${o.b.name}><i style=${{ background: o.c }}></i>${o.b.name}</span>`)}
      ${lim && html`<span><i class="sw" style=${{ background: "color-mix(in srgb,var(--ink) 9%,transparent)", border: "1px solid var(--ink-faint)" }}></i>${lim.warm_c}–${lim.crit_c}°<${Info} k="band" /></span>`}
    </div>
    <svg class="trend" ref=${ref} viewBox=${`0 0 ${W} ${H}`} tabIndex="0" role="img"
      aria-label=${`Hottest temperature of ${list.map(o => o.b.name).join(", ")} over the last ${RANGES[rk].label}. Use left and right arrows to read values.`}
      onPointerMove=${e => pick(e.clientX)} onPointerDown=${e => pick(e.clientX)} onPointerLeave=${() => setIdx(null)}
      onFocus=${() => setIdx(i => i ?? N - 1)} onBlur=${() => setIdx(null)} onKeyDown=${onKey}>
      ${yt.map(v => html`<g key=${"y" + v}><line x1=${L} x2=${R} y1=${y(v)} y2=${y(v)} stroke="var(--line)" stroke-width="1"/>
        <text x=${L - 8} y=${y(v) + 4} text-anchor="end">${v}°</text></g>`)}
      ${lim && html`<rect x=${L} width=${R - L} y=${y(Math.min(hi, lim.crit_c))} height=${Math.max(0, y(Math.max(lo, lim.warm_c)) - y(Math.min(hi, lim.crit_c)))} fill="color-mix(in srgb,var(--ink) 6%,transparent)"/>`}
      ${list.map(o => html`<path key=${o.b.name} d=${pathOf(xs, o.h.temp.map(v => v == null ? null : y(v)))} fill="none" stroke=${o.c} stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`)}
      ${ends.map(e => html`<g key=${"e" + e.b.name}>
        <circle cx=${x(e.li)} cy=${e.vy} r="4" fill=${e.c} stroke="var(--surface)" stroke-width="2"/>
        <path d=${`M${x(e.li) + 6},${e.vy} L${R + 8},${e.vy} L${R + 14},${e.ly}`} fill="none" stroke="var(--line-strong)" stroke-width="1"/>
        <text class="end" x=${R + 18} y=${e.ly + 4}>${e.b.name} ${fmt(e.h.temp[e.li])}°</text></g>`)}
      ${xt.map(i => html`<text key=${"x" + i} x=${x(i)} y=${B + 18} text-anchor=${i === 0 ? "start" : i === N - 1 ? "end" : "middle"}>${hhmm(t0[i])}</text>`)}
      ${list.map((o, r) => { const yy = stripTop + r * rowH; const runs = [];
        o.h.level.forEach((l, i) => { const last = runs[runs.length - 1]; if (last && last.l === l) last.j = i; else runs.push({ l, i, j: i }); });
        return html`<g key=${"s" + o.b.name}>
          <line x1=${R + 8} x2=${R + 14} y1=${yy + 5} y2=${yy + 5} stroke=${o.c} stroke-width="2"/>
          <text x=${R + 18} y=${yy + 9}>${o.b.name}</text>
          ${o.b.limits ? runs.map((rn, k) => html`<rect key=${k} x=${x(rn.i)} y=${yy} width=${Math.max(1, x(rn.j) - x(rn.i) + (R - L) / (N - 1))} height="10" rx="2" fill=${lvColor(rn.l)}/>`)
            : html`<rect x=${L} y=${yy} width=${R - L} height="10" rx="2" fill="none" stroke="var(--line-strong)" stroke-dasharray="3 3"/>`}
        </g>`; })}
      <text x=${L - 8} y=${stripTop + 9} text-anchor="end">level</text>
      ${idx != null && html`<g pointer-events="none">
        <line x1=${x(idx)} x2=${x(idx)} y1=${T} y2=${stripTop + list.length * rowH} stroke="var(--ink-faint)" stroke-width="1"/>
        ${list.map(o => o.h.temp[idx] != null && html`<circle key=${"h" + o.b.name} cx=${x(idx)} cy=${y(o.h.temp[idx])} r="4.5" fill=${o.c} stroke="var(--surface)" stroke-width="2"/>`)}
      </g>`}
    </svg>
    ${idx != null && html`<div class="tip" style=${tipLeft > 55 ? { right: (100 - tipLeft + 2) + "%" } : { left: (tipLeft + 2) + "%" }}>
      <div class="tt">${rk === "15m" ? hhmmss(t0[idx]) : hhmm(t0[idx])} UTC</div>
      ${[...list].sort((a, b) => (b.h.temp[idx] ?? -1) - (a.h.temp[idx] ?? -1)).map(o => html`<div class="r" key=${o.b.name}>
        <span><i style=${{ background: o.c }}></i>${o.b.name}</span>
        <b>${o.h.temp[idx] == null ? "—" : fmt(o.h.temp[idx]) + " °C"}${o.h.level[idx] != null ? " · " + LEVELS[o.h.level[idx]] : ""}</b></div>`)}
    </div>`}
  </div>`;
}

function Compare({ items, slots, rk, table, onRemove }) {
  const list = items.map(b => ({ b, h: history(b, rk), c: slotColor(slots[b.name] ?? 0) })).filter(o => o.h);
  const rows = Array.from({ length: 12 }, (_, k) => Math.round(k * (NPTS - 1) / 11)).reverse();
  if (!list.length) return html`<div class="nodata">None of these machines has readings.</div>`;
  return html`<${React.Fragment}>
    <div class="chartcard tablewrap"><table class="dt cmp">
      <thead><tr><th>Machine</th><th>Now</th><th>Peak</th><th>Average</th><th>Above warm</th><th></th></tr></thead>
      <tbody>${list.map(o => { const s = summarize(o.b, o.h); return html`<tr key=${o.b.name}>
        <td><i class="key" style=${{ background: o.c }}></i>${o.b.name}</td>
        <td><span class=${"status " + o.b.state}>${statusText(o.b)}</span> ${fmt(o.b.temp)}°</td>
        <td>${fmt(s.peak)}°</td><td>${fmt(s.mean)}°</td>
        <td>${s.share ? Math.round((1 - s.share[0]) * 100) + "%" : "—"}</td>
        <td><button class="rm" onClick=${() => onRemove(o.b.name)} aria-label=${"Remove " + o.b.name}>×</button></td></tr>`; })}</tbody>
    </table></div>
    ${table ? html`<div class="chartcard tablewrap"><table class="dt">
        <thead><tr><th>Time (UTC)</th>${list.map(o => html`<th key=${o.b.name}>${o.b.name}</th>`)}</tr></thead>
        <tbody>${rows.map(i => html`<tr key=${i}><td>${rk === "15m" ? hhmmss(list[0].h.t[i]) : hhmm(list[0].h.t[i])}</td>
          ${list.map(o => html`<td key=${o.b.name}>${o.h.temp[i] == null ? "—" : fmt(o.h.temp[i]) + " °C"}</td>`)}</tr>`)}</tbody>
      </table></div>` : html`<${CompareChart} list=${list} rk=${rk} key=${rk + list.map(o => o.b.name).join()} />`}
    ${list.some(o => o.b.limits) && html`<div class="chartcard"><h3>Time by level · last ${RANGES[rk].label}</h3>
      <div class="lvrows">${list.filter(o => o.b.limits).map(o => { const s = summarize(o.b, o.h); return html`<div class="lvrow" key=${o.b.name}>
        <span class="nm"><i class="key" style=${{ background: o.c }}></i>${o.b.name}</span>
        <div class="seg2" role="img" aria-label=${o.b.name + ": " + LEVELS.map((l, i) => `${l} ${Math.round(s.share[i] * 100)}%`).join(", ")}>
          ${s.share.map((x, i) => x > 0 && html`<span key=${i} style=${{ flex: x, background: lvColor(i) }} title=${`${LEVELS[i]} ${Math.round(x * 100)}%`}></span>`)}</div>
        <span class="pct">${Math.round((1 - s.share[0]) * 100)}% above warm</span></div>`; })}</div>
      <div class="sharelab">${LEVELS.map((l, i) => html`<span key=${l}><i style=${{ background: lvColor(i) }}></i>${l}</span>`)}</div>
    </div>`}
  </${React.Fragment}>`;
}

function AddPicker({ fleet, items, onAdd }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const wrap = React.useRef(null);
  useEffect(() => {
    if (!open) return;
    const off = e => { if (wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    addEventListener("pointerdown", off); return () => removeEventListener("pointerdown", off);
  }, [open]);
  const full = items.length >= MAXC, names = new Set(items.map(b => b.name));
  const opts = fleet.filter(b => !q || b.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => (SEVERITY[b.state] - SEVERITY[a.state]) || ((b.temp ?? -1) - (a.temp ?? -1)));
  return html`<div class="picker" ref=${wrap}>
    <button class="addbtn" aria-expanded=${open} aria-haspopup="listbox" disabled=${full} onClick=${() => setOpen(o => !o)}>
      ${full ? `${MAXC} machines max` : "+ Add machine"}</button>
    ${open && html`<div class="pop" onKeyDown=${e => { if (e.key === "Escape") { e.stopPropagation(); setOpen(false); } }}>
      <input id="add-machine-search" class="search" type="search" placeholder="Find a machine" value=${q} onInput=${e => setQ(e.target.value)} autoFocus aria-label="Find a machine to add" />
      <div class="opts" role="listbox" aria-label="Machines">
        ${opts.map(b => { const off = names.has(b.name) || b.temp == null;
          return html`<button key=${b.name} role="option" aria-selected=${names.has(b.name)} class=${"opt2 " + b.state} disabled=${off}
            onClick=${() => { onAdd(b.name); setQ(""); if (items.length + 1 >= MAXC) setOpen(false); }}>
            <span class="status"></span><span class="nm">${b.name}</span>
            <span class="meta">${b.temp == null ? "no readings" : names.has(b.name) ? "added" : fmt(b.temp) + "° · " + PLATFORM_LABEL[b.pkey]}</span></button>`; })}
      </div></div>`}
  </div>`;
}

function Detail({ items, slots, skin, fleet, onClose, onAdd, onRemove }) {
  const [rk, setRk] = useState("1h");
  const [table, setTable] = useState(false);
  const closeRef = React.useRef(null);
  useEffect(() => {
    const prev = document.activeElement; closeRef.current && closeRef.current.focus();
    const on = e => { if (e.key === "Escape") onClose(); };
    addEventListener("keydown", on);
    return () => { removeEventListener("keydown", on); prev && prev.focus && prev.focus(); };
  }, []);
  const one = items.length === 1, b = items[0];
  const h = one ? history(b, rk) : null;
  return html`<${React.Fragment}>
    <div class="scrim"></div>
    <aside class=${"drawer " + (one ? b.state : "")} role="dialog" aria-label=${one ? b.name + " trends" : "Comparing " + items.length + " machines"}>
      <div class="dh">
        <div style=${{ minWidth: 0 }}>
          <span class="eyebrow">Example history · daemons don't serve history yet</span>
          ${one ? html`<h2><${Mark} b=${b} skin=${skin} />${b.name}${b.demo && html`<span class="tag">example</span>`}</h2>
            <div class="sub">${b.board} · ${b.sub || (b.state === "unkept" ? "no daemon yet" : `${PLATFORM_LABEL[b.pkey]} · v${b.version}`)}</div>`
          : html`<h2>Comparing ${items.length} machines</h2>
            <div class="chips">${items.map(m => html`<span class="mchip" key=${m.name}><i class="key" style=${{ background: slotColor(slots[m.name] ?? 0) }}></i>${m.name}
              <button onClick=${() => onRemove(m.name)} aria-label=${"Remove " + m.name}>×</button></span>`)}</div>`}
        </div>
        <button class="xbtn" ref=${closeRef} onClick=${onClose} aria-label="Close">×</button>
      </div>
      ${one && html`<div class="dnow">
        <span class="temp">${fmt(b.temp)}<small>°C</small></span>
        <span class="status">${statusText(b)}</span>
        <span class="why">${whyText(b)}</span>
      </div>`}
      <div class="drow">
        <div class="drow-l">
          ${(!one || h) && html`<div class="pills sm" role="group" aria-label="Time range">
            ${Object.entries(RANGES).map(([k]) => html`<button key=${k} aria-pressed=${rk === k} onClick=${() => setRk(k)}>${k}</button>`)}
          </div>`}
          <${AddPicker} fleet=${fleet} items=${items} onAdd=${onAdd} />
        </div>
        ${(!one || h) && html`<button class="linkbtn" onClick=${() => setTable(t => !t)} aria-pressed=${table}>${table ? "Show chart" : "Show table"}</button>`}
      </div>
      <p class="hint">You can also click machines in the list to add or remove them.</p>
      ${one ? (h ? html`<${Single} b=${b} h=${h} rk=${rk} table=${table} />` : html`<div class="nodata">No readings. ${HINT.sensors}</div>`)
            : html`<${Compare} items=${items} slots=${slots} rk=${rk} table=${table} onRemove=${onRemove} />`}
    </aside>
  </${React.Fragment}>`;
}

function Machines({ skin, setSkin, mode, fleetKey, setFleet }) {
  const s = SKINS[skin];
  const fleet = FLEETS[fleetKey];
  const [plat, setPlat] = useState("all");
  const [states, setStates] = useState([]);
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("hot");
  const [view, setView] = useState(() => store.get("hg-view", "rows"));
  const [picked, setPicked] = useState([]);
  const [slots, setSlots] = useState({});
  useEffect(() => { setPlat("all"); setStates([]); setQ(""); setPicked([]); setSlots({}); }, [fleetKey]);
  // colour follows the machine: each gets the lowest free slot when added and keeps it
  const add = name => { setPicked(p => p.includes(name) || p.length >= MAXC ? p : [...p, name]);
    setSlots(s => { if (picked.includes(name)) return s; const used = new Set(picked.map(n => s[n])); let k = 0; while (used.has(k)) k++; return { ...s, [name]: k }; }); };
  const remove = name => setPicked(p => p.filter(n => n !== name));
  const onOpen = name => { if (!picked.length) { setPicked([name]); setSlots({ [name]: 0 }); } else if (picked.includes(name)) remove(name); else add(name); };
  const items = picked.map(n => fleet.find(b => b.name === n)).filter(Boolean);
  const counts = useMemo(() => fleet.reduce((c, b) => (c[b.state] = (c[b.state] || 0) + 1, c), {}), [fleet]);
  const platCounts = useMemo(() => fleet.reduce((c, b) => (c[b.pkey] = (c[b.pkey] || 0) + 1, c), {}), [fleet]);
  const shown = fleet
    .filter(b => plat === "all" || b.pkey === plat)
    .filter(b => !states.length || states.includes(b.state))
    .filter(b => !q || b.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => sort === "hot" ? (SEVERITY[b.state] - SEVERITY[a.state]) || ((b.temp ?? -1) - (a.temp ?? -1)) : a.name.localeCompare(b.name, undefined, { numeric:true }));
  const platKeys = ["all", ...new Set(fleet.map(b => b.pkey))];
  const toggle = st => setStates(xs => xs.includes(st) ? xs.filter(x => x !== st) : [...xs, st]);
  const filtered = plat !== "all" || states.length || q;
  return html`<section>
    <div class="titlebar">
      <div><span class="eyebrow">${fleetKey === "today" ? "Snapshot · " + DATA.snapshot : "Example fleet · invented readings"}</span><h1>Heat Governor</h1></div>
      <div class="pills" role="group" aria-label="Fleet">
        <button aria-pressed=${fleetKey === "today"} onClick=${() => setFleet("today")}>Today<span class="n">${real.length}</span></button>
        <button aria-pressed=${fleetKey === "example"} onClick=${() => setFleet("example")}>Scaled<span class="n">${EXAMPLE.length}</span></button>
        <button aria-pressed=${fleetKey === "mixed"} onClick=${() => setFleet("mixed")}>Mixed<span class="n">${MIXED.length}</span></button>
      </div>
    </div>
    <div class="skins" role="group" aria-label="Theme">
      ${Object.entries(SKINS).map(([k, sk]) => html`<button key=${k} class="skin" aria-pressed=${skin === k} onClick=${() => setSkin(k)}
          style=${{ "--sk-bg": sk[mode].bg, "--sk-ink": sk[mode].ink, "--sk-heat": sk[mode].heat }}>
        <span class="nm">${sk.name}</span><span class="ramp"></span>
        <span class="ends"><span>${sk.ends[0]}</span><span>${sk.ends[1]}</span></span></button>`)}
    </div>
    <div class="card"><${Flow} fleet=${fleet} /></div>

    <div class="summary" role="group" aria-label="Filter by state">
      ${["critical", "hot", "warm", "cool", "unreachable", "unsupported", "unkept"].filter(st => counts[st]).map(st => html`
        <button key=${st} class=${"chip " + st} aria-pressed=${states.includes(st)} onClick=${() => toggle(st)}><b>${counts[st]}</b>${st === "unsupported" ? "not supported" : st}</button>`)}
    </div>
    <div class="filters">
      <div class="pills sm" role="group" aria-label="Platform">
        ${platKeys.map(p => html`
          <button key=${p} aria-pressed=${plat === p} onClick=${() => setPlat(p)}>${p === "all" ? "All" : PLATFORM_LABEL[p]}<span class="n">${p === "all" ? fleet.length : platCounts[p]}</span></button>`)}
      </div>
      <input id="machine-search" class="search" type="search" placeholder="Find a machine" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Find a machine" />
      <div class="pills sm" role="group" aria-label="Sort">
        <button aria-pressed=${sort === "hot"} onClick=${() => setSort("hot")}>Hottest first</button>
        <button aria-pressed=${sort === "name"} onClick=${() => setSort("name")}>Name</button>
      </div>
      <div class="pills sm" role="group" aria-label="View">
        <button aria-pressed=${view === "rows"} onClick=${() => { setView("rows"); store.set("hg-view", "rows"); }}>Rows</button>
        <button aria-pressed=${view === "grid"} onClick=${() => { setView("grid"); store.set("hg-view", "grid"); }}>Grid</button>
      </div>
      <span class="count">${shown.length} of ${fleet.length}${filtered ? html` <button class="clear" onClick=${() => { setPlat("all"); setStates([]); setQ(""); }}>Clear</button>` : ""}</span>
    </div>
    ${!shown.length ? html`<div class="empty">No machine matches these filters.</div>` :
      view === "rows" ? html`<div class="lanes">${shown.map(b => html`<${Lane} b=${b} skin=${s} key=${b.name} open=${picked.includes(b.name)} onOpen=${onOpen} />`)}</div>`
                      : html`<div class="tiles">${shown.map(b => html`<${Tile} b=${b} skin=${s} key=${b.name} open=${picked.includes(b.name)} onOpen=${onOpen} />`)}</div>`}
    ${items.length > 0 && html`<${Detail} items=${items} slots=${slots} skin=${s} fleet=${fleet} onClose=${() => { setPicked([]); setSlots({}); }} onAdd=${add} onRemove=${remove} />`}
  </section>`;
}

function Survey() {
  const [f, setF] = useState("all");
  const claims = Object.fromEntries(DATA.claims.map(c => [c.id, c]));
  const kinds = { all: "All", requirement: "In scope", boundary: "Boundaries", non_goal: "Non-goals" };
  const rows = DATA.scope.filter(s => f === "all" || s.seeds.some(id => claims[id] && claims[id].kind === f));
  return html`<section>
    <span class="eyebrow">devague frame · ${DATA.frame}</span>
    <h1>Survey</h1>
    <p class="lede" style=${{ marginTop: ".6rem" }}>${DATA.scope.length} surfaces explored read-only. Every claim is proposed until you confirm it.</p>
    <div class="pills sm" role="group" aria-label="Filter by claim kind" style=${{ display: "inline-flex", marginBottom: 18 }}>
      ${Object.entries(kinds).map(([k, l]) => html`<button key=${k} aria-pressed=${f === k} onClick=${() => setF(k)}>${l}</button>`)}
    </div>
    <div class="surfaces">${rows.map(s => html`<div class="surface" key=${s.id}>
      <span class="sid">${s.id}</span>
      <div style=${{ minWidth: 0 }}><h3>${s.surface}</h3><p>${s.finding}</p>
        ${s.seeds.map(id => claims[id] && html`<div key=${id} class=${"claim k-" + claims[id].kind}><span class="k">${claims[id].kind.replace("_", "-")}</span>${claims[id].text}</div>`)}
      </div></div>`)}</div>
  </section>`;
}

function Decisions() {
  return html`<section>
    <span class="eyebrow">Open before /think converges</span>
    <h1 style=${{ marginBottom: "1.2rem" }}>Decisions</h1>
    <div class="alert"><b>spark flared during the survey:</b> critical at 89.1 °C, then warm at 85.4 °C and falling. Its own governor handled it.</div>
    <div class="qs">${DATA.questions.map(q => html`<div class="card q" key=${q.id}>
      <span class="qid">${q.id}</span><h3>${q.title}</h3>
      ${q.resolved ? html`<div class="resolved"><b>Settled.</b> ${q.resolved}</div>` : html`<div class="opts">
        ${q.options.map((o, i) => html`<div key=${i} class=${"opt" + (o.rec ? " rec" : "")}>${o.rec && html`<span class="tg">Recommended</span>`}<b>${o.t}</b>${o.d}</div>`)}</div>`}
    </div>`)}</div>
    <h2>Parked, not blocking</h2>
    <div class="qs">${DATA.parks.map((p, i) => html`<div class="park" key=${i}>${p}</div>`)}</div>
  </section>`;
}

function App() {
  const readTab = () => { const h = (location.hash || "").slice(1); return TABS.some(t => t[0] === h) ? h : "machines"; };
  const [tab, setTab] = useState(readTab);
  const [skin, setSkinS] = useState(() => { const v = store.get("hg-skin", "polar"); return SKINS[v] ? v : "polar"; });
  const [pref, setPrefS] = useState(() => store.get("hg-mode", "system"));
  const [fleetKey, setFleet] = useState("today");
  const mode = useMode(pref);
  const setSkin = k => { setSkinS(k); store.set("hg-skin", k); };
  const setPref = k => { setPrefS(k); store.set("hg-mode", k); };
  useEffect(() => { const r = document.documentElement; r.dataset.skin = skin; r.dataset.mode = mode; }, [skin, mode]);
  useEffect(() => { const on = () => setTab(readTab()); addEventListener("hashchange", on); return () => removeEventListener("hashchange", on); }, []);
  const go = t => { setTab(t); try { history.replaceState(null, "", "#" + t); } catch (e) { location.hash = t; } };
  return html`<${React.Fragment}>
    <header class="app-header">
      <div class="brand">${SKINS[skin].runes ? html`<span class="mark rune" aria-hidden="true">ᚲ</span>` : html`<span class="mark" aria-hidden="true">●</span>`}heat-governor</div>
      <nav class="pills" aria-label="Sections">${TABS.map(([k, l]) => html`<button key=${k} aria-current=${tab === k ? "page" : undefined} onClick=${() => go(k)}>${l}</button>`)}</nav>
      <div class="pills sm" role="group" aria-label="Appearance">
        ${[["system", "Auto"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => html`<button key=${k} aria-pressed=${pref === k} onClick=${() => setPref(k)}>${l}</button>`)}
      </div>
    </header>
    <main>${tab === "machines" ? html`<${Machines} skin=${skin} setSkin=${setSkin} mode=${mode} fleetKey=${fleetKey} setFleet=${setFleet} />`
      : tab === "survey" ? html`<${Survey} />` : html`<${Decisions} />`}</main>
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
